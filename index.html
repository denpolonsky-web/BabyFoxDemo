const CARD_ICON={'Ёж':'🦔','Белка':'🐿️','Заяц':'🐇','Ласка':'🦡','Барсук':'🦡','Бобр':'🦫',
  'Рысь':'🐆','Сова':'🦉','Олень':'🦌','Волк':'🐺','Медведь':'🐻','Лис':'🦊'};
function cardIcon(c){ return CARD_ICON[CFG.animals[c.deck]]||'🌿'; }
const RAR_RU={C:'обычная',R:'редкая',L:'легендарная'};

// Сколько даст бонус-карта в текущем раскладе (0 — не сработает)
function bonusGain(b, myV, cardId, statIdx){
  if(b.type==='up'||b.type==='down') return b.val;
  if(b.type==='upStat'||b.type==='downStat') return b.stat===statIdx ? b.val : 0;
  if(b.type==='rage') return Math.round(myV*(CFG.rageMult-1));
  if(b.type==='swap') return Math.max(...CARDS[cardId].st)-myV;
  return 0;
}

// Одна игровая карта. mode: 'name' — характеристики кликабельны; 'pick' — карта кликабельна целиком; 'flat' — только показ
function battleCardHTML(id,{mode='flat',hotStat=null,selected=false,onCard='',onStat='',badge=''}={}){
  const c=CARDS[id];
  const sorted=c.st.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
  const top=sorted[0].i, second=sorted[1].i;
  let h=`<div class="pcard ${c.rar}${selected?' sel':''}" ${mode==='pick'&&onCard?`onclick="${onCard.replace('{id}',id)}"`:''}>
    ${badge?`<span class="c3-badge">${badge}</span>`:''}<div class="phead"><div class="pname">${c.name}</div>
      <div class="prar"><i class="rdot ${c.rar}"></i>${RAR_RU[c.rar]}</div></div>
    <div class="pface">${cardIcon(c)}</div>
    <div class="pstats">`;
  c.st.forEach((v,si)=>{
    const cls = si===hotStat ? 'hot' : ((si===top||si===second)?'top':'');
    if(mode==='name') h+=`<button class="pstat ${cls}" onclick="${onStat.replace('{id}',id).replace('{si}',si)}"><span>${CFG.statNames[si]}</span><b>${v}</b></button>`;
    else h+=`<div class="pstat ${cls}"><span>${CFG.statNames[si]}</span><b>${v}</b></div>`;
  });
  h+='</div></div>';
  return h;
}

const ginner=h=>`<div class="ginner">${h}</div>`;
const plural=(n,a,b,c)=>{const d=n%10,e=n%100; return (d===1&&e!==11)?a:((d>=2&&d<=4&&(e<10||e>=20))?b:c);};
// Полоса бонус-карт: весь запас, отсортированный по полезности. Первая помечена как
// рекомендованная, но нажать можно любую — ограничения на выбор нет.
function applicableBonuses(list){
  return list.filter(b=>b.g>0||b.type==='cancel'||b.type==='shield'||b.type==='swap');
}

function bonusPreview(){
  const list=bonusOwnedList();
  if(!list.length) return '<div class="ghelp bonusempty">Бонус-карт нет</div>';

  let s='<div class="gbonus bonuspreview">';
  list.forEach(b=>{
    s+=`<div class="bchip ${b.rar}">
      ${b.name}<em>${b.desc}</em>
    </div>`;
  });
  return s+'</div>';
}

function bonusStrip(list, handler, selected){
  if(!list.length) return '<div class="ghelp bonusempty">Бонус-карт нет</div>';

  const applicable=applicableBonuses(list);
  const applicableIds=new Set(applicable.map(b=>b.i));
  const bestId=applicable.length ? applicable[0].i : null;

  let s='<div class="gbonus">';
  list.forEach((b)=>{
    const fits=applicableIds.has(b.i);
    const best=b.i===bestId;
    const cls=[
      b.rar,
      fits?'fit':'',
      b.decides?'decides':'',
      best?'best':'',
      selected===b.i?'sel':''
    ].filter(Boolean).join(' ');

    const note=b.decides ? ' · переворачивает раунд' : '';
    const hold=!b.decides && b.rar==='L' ? ' · редкая тактика' : '';

    s+=`<button class="bchip ${cls}" onclick="${handler}(${b.i})">
      ${best?'<u>лучший сейчас</u>':''}${b.name}<em>${b.desc}${note}${hold}</em></button>`;
  });
  return s+'</div>';
}

function suitableHandIds(hand, statIdx){
  if(statIdx===null||statIdx===undefined||statIdx<0||!hand.length) return new Set();
  const ranked=[...hand].sort((a,b)=>CARDS[b].st[statIdx]-CARDS[a].st[statIdx]);
  const best=CARDS[ranked[0]].st[statIdx];
  const minCount=Math.min(ranked.length, Math.max(2,Math.ceil(ranked.length/2)));
  const out=new Set(ranked.slice(0,minCount));
  ranked.forEach(id=>{ if(CARDS[id].st[statIdx] >= best*.88) out.add(id); });
  return out;
}
function handAnchorRatio(){
  return 0.5;
}
function syncHandCarousel(el){
  if(!el) return;
  cancelAnimationFrame(el._raf);
  el._raf=requestAnimationFrame(()=>{
    const items=[...el.querySelectorAll('.fanitem')];
    if(!items.length) return;
    const anchor=el.scrollLeft+el.clientWidth*handAnchorRatio();
    let best=items[0],dist=Infinity,activeIndex=0;
    items.forEach((it,idx)=>{
      const c=it.offsetLeft+it.offsetWidth/2;
      const d=Math.abs(c-anchor);
      if(d<dist){dist=d;best=it;activeIndex=idx;}
    });
    items.forEach((it,idx)=>{
      it.classList.toggle('active',it===best);
      const rel=Math.max(-3,Math.min(3,idx-activeIndex));
      if(rel===0) it.removeAttribute('data-fan');
      else it.setAttribute('data-fan',String(rel));
    });
  });
}
function focusHandItem(el){
  if(!el) return;
  const row=el.parentElement;
  if(row){
    const target=row.clientWidth*handAnchorRatio()-el.offsetWidth/2;
    const max=Math.max(0,row.scrollWidth-row.clientWidth);
    const left=Math.max(0,Math.min(max,el.offsetLeft-target));
    row.scrollTo({left,behavior:'smooth'});
    setTimeout(()=>syncHandCarousel(row),180);
  }
}
function initHandCarousel(){
  const el=document.getElementById('handCarousel'); if(!el) return;
  const items=[...el.querySelectorAll('.fanitem')];
  if(!items.length) return;
  const selected=M&&M.myCard!==null&&M.myCard!==undefined ? M.myCard : null;
  const target=selected!==null ? el.querySelector(`[data-card="${selected}"]`) : items[0];
  if(target){
    const desired=el.clientWidth*handAnchorRatio()-target.offsetWidth/2;
    const max=Math.max(0,el.scrollWidth-el.clientWidth);
    el.scrollLeft=Math.max(0,Math.min(max,target.offsetLeft-desired));
  }
  syncHandCarousel(el);
}

function renderMatch(){
  const m=M.m, el=$('match');
  el.style.display='block';
  let h='';
  h+=`<div class="gtop">
    <div class="gscore"><span class="me">${M.myWins}</span><i>:</i><span class="op">${M.botWins}</span></div>
    <div class="ginfo"><b>${m.name}</b>
      <div class="gpips">${Array.from({length:m.cards},(_,i)=>{
        const r=(M.history||[])[i];
        const cl=r?(r.res==='win'?'w':(r.res==='lose'?'l':'d')):(i+1===M.round?'now':'');
        return `<i class="${cl}"></i>`;}).join('')}</div></div>
    ${M.phase!=='over'?`<div class="gclock" id="turnclock">${turnLeft||CFG.turnSeconds}</div>`:''}
    <button class="gx" onclick="quitMatch()">${M.phase==='over'?'✕':'Выйти'}</button>
  </div>`;
  if(M.phase!=='over') h+=`<div class="gbar"><i id="turnbar"></i></div>`;

  if(M.phase==='over'){
    const cls=M.result==='победа'?'win':(M.result==='ничья'?'':'lose');
    h+=`<div class="gover"><div class="gres ${cls}">${M.result==='победа'?'Победа':(M.result==='ничья'?'Ничья':'Поражение')} ${M.myWins}:${M.botWins}</div>
        <div class="muted">+${M.coinsGot} монет${M.ratGot?` · +${M.ratGot} рейтинга`:''}${M.lostCards?` · потеряно карт: ${M.lostCards}`:''}</div></div>`;
    h+=`<div class="histh">Как прошёл бой</div>`+roundsTable(M.history);
    h+=`<button class="gbtn" onclick="quitMatch()">Вернуться в игру</button>`;
    el.innerHTML=ginner(h); stopTurnTimer(); return;
  }

  const R=(M.phase==='reveal')?M.reveal:null;
  const BR=M.boardReveal||R;
  const answering=M.namer==='bot';
  const selected=M.myCard!==null && M.myCard!==undefined;
  const shownStat=BR?BR.statIdx:(answering?M.pendingStat:(selected?M.myStat:null));

  h+=`<div class="gopp"><div class="glabel">Карты соперника</div><div class="goppbar">
    <div class="opstack"><div class="gback"></div><div class="gback"></div><div class="gback"></div><span class="stackcount">×${M.botHand.length}</span></div>
  </div></div>`;

  const slotBonus=(idx)=>{
    if(idx===null||idx===undefined||!BONUS[idx]) return '';
    const b=BONUS[idx];
    return `<div class="slotbonus ${b.rar}">
      <span>Бонус</span><b>${b.name}</b><em>${b.desc}</em>
    </div>`;
  };

  const slotCard=(side)=>{
    const mine=side==='me';
    if(BR){
      const cid=mine?BR.myCard:BR.botCard;
      const bonusIdx=mine?BR.myBonusIdx:BR.botBonusIdx;
      const result=BR.res==='draw'?'draw':((mine&&BR.res==='win')||(!mine&&BR.res==='lose')?'win':'lose');
      return `<span class="slotresult ${result}">${result==='win'?'выиграл':(result==='lose'?'проиграл':'ничья')}</span>
        <div class="slotopen">
          <div class="slotduo ${bonusIdx===null||bonusIdx===undefined?'solo':'withbonus'}">
            <div class="slotmain">${battleCardHTML(cid,{mode:'flat',hotStat:BR.statIdx})}</div>
            ${slotBonus(bonusIdx)}
          </div>
        </div>`;
    }
    if(selected) return `<div class="slotback"></div>`;
    return `<div class="slotempty">${mine?'Ваша карта':'Карта соперника'}<br><span>появится здесь</span></div>`;
  };

  h+=`<div class="playboard">
    <div class="boardmid">
      <div class="roundstat"><b>${shownStat===null||shownStat===undefined?'Ждём выбора игрока':'Играем по '+CFG.statPlayNames[shownStat]}</b></div>
      <div class="versus">СРАВНЕНИЕ КАРТ</div>
    </div>
    <div class="playslot op"><span class="slotlabel">Соперник</span>${slotCard('op')}</div>
    <div class="playslot me"><span class="slotlabel">Вы</span>${slotCard('me')}</div>
  </div>`;

  if(BR){
    h+=`<div class="revealnote ${BR.res}">${BR.res==='win'?'ПОБЕДА В РАУНДЕ':(BR.res==='lose'?'ПОРАЖЕНИЕ В РАУНДЕ':'НИЧЬЯ')}</div>`;
    h+=`<button class="gbtn revealnext" onclick="advanceBoardReveal()">Готов — дальше →</button>`;
    if(M.history && M.history.length){
      h+=`<button class="fhead ghist" onclick="toggleOpen('rounds')"><span class="fchev ${OPEN.rounds?'on':''}">›</span><b>История раундов</b><span class="fright">${M.history.length}/${m.cards}</span></button>`;
      if(OPEN.rounds) h+=roundsTable(M.history);
    }
    el.innerHTML=ginner(h);
    return;
  }

  const st=answering?M.pendingStat:(selected?M.myStat:null);

  // ЕДИНЫЙ бонус-блок всегда стоит в одном месте — над основными картами.
  // До выбора карты/характеристики он информационный, после выбора становится интерактивным.
  const previewList=bonusOwnedList();
  if(selected){
    const ranked=bonusRanked(M.myStat,M.myCard);
    if(ranked.length){
      h+=`<div class="battlebonusfixed">
        <div class="battlebonuslabel">Выберите бонус-карту:</div>
        ${bonusStrip(ranked,'chooseMyBonus',M.myBonus)}
      </div>`;
    }else{
      h+=`<div class="battlebonusfixed"><div class="battlebonuslabel">Бонус-карт нет</div></div>`;
    }
  }else{
    if(previewList.length){
      h+=`<div class="battlebonusfixed">
        <div class="battlebonuslabel">Выберите бонус-карту:</div>
        ${bonusPreview()}
      </div>`;
    }else{
      h+=`<div class="battlebonusfixed"><div class="battlebonuslabel">Бонус-карт нет</div></div>`;
    }
  }

  const hand=[...M.myHand].sort((a,b)=> st!==null&&st!==undefined
      ? CARDS[b].st[st]-CARDS[a].st[st]
      : Math.max(...CARDS[b].st)-Math.max(...CARDS[a].st));
  const suitable=suitableHandIds(hand,st);
  h+=`<div class="handprompt ${answering?'answering':'naming'}">${
      answering
        ? `Выберите карту для характеристики: <b>${CFG.statNames[M.pendingStat]}</b>`
        : '<b>Выберите сравниваемую характеристику</b>'
    }</div>`;
  h+=`<div class="glabel">Карты в руке · ${hand.length}</div>
      <div class="ghand" id="handCarousel" onscroll="syncHandCarousel(this)">`;
  hand.forEach((id,k)=>{
    const cls=[suitable.has(id)?'fit':'', k===0?'best':''].filter(Boolean).join(' ');
    h+=`<div class="fanitem ${cls}" data-card="${id}" onclick="focusHandItem(this)">
      ${battleCardHTML(id,{
        mode:answering?'pick':'name',
        hotStat:st,
        selected:M.myCard===id,
        onCard:`selectMove({id},${answering?M.pendingStat:-1})`,
        onStat:`selectMove({id},{si})`
      })}
    </div>`;
  });
  h+=`</div><div class="carouselhint">Лучшая карта отмечена отдельно · смахивайте веер влево/вправо</div>`;

  if(selected){
    h+=`<button class="gbtn" onclick="confirmMove()">${
      M.myBonus!==null?'Сыграть с «'+BONUS[M.myBonus].name+'»':'Сыграть ход'
    } →</button>`;
  }

  if(M.history && M.history.length){
    h+=`<button class="fhead ghist" onclick="toggleOpen('rounds')">
      <span class="fchev ${OPEN.rounds?'on':''}">›</span><b>История раундов</b>
      <span class="fright">${M.history.length}/${m.cards}</span></button>`;
    if(OPEN.rounds) h+=roundsTable(M.history);
  }
  el.innerHTML=ginner(h);
  requestAnimationFrame(initHandCarousel);
  paintTimer();
}
function quitMatch(){ stopTurnTimer(); M=null; $('match').style.display='none'; render(); }
// Ожидаемая последовательность сбора карт: личная очередь колод игрока.
// Очередь перемешивается целиком и заново при каждом старте сезона: какое животное
// окажется первым, а какое последним, заранее не известно и у двух игроков не совпадёт.
// Сейф закрывает карты только в последней шестёрке ЭТОЙ очереди и открывает их
// строго по ней же — ближайшая колода освобождается первой.
function queueStrip(){
  return `<div class="qbox userprogress">
    <div class="qhead">Собирайте все 12 колод</div>
    <div class="qnote">Карты разных зверей появляются по мере игры. Не все карты обязательно доступны одновременно — продолжайте выполнять задания, открывать паки и играть.</div>
  </div>`;
}
function renderCollection(){
  const lockedSet=new Set(safeLocked());
  const safeCount=lockedSet.size;
  const own=ownedCards().length;
  const need=bkNeedsPick();

  let h=`<div class="striphead"><h3>Коллекция</h3>
    <span class="tag">${uniq()}/120 · ${closedDecks()}/12 колод</span></div>`;

  h+=`<div class="collection-summary">
    <span>Собрано <b>${uniq()}</b></span>
    <span>На руках <b>${own}</b></span>
    <span>В сейфе <b>${safeCount}</b></span>
  </div>`;

  h+=`<p class="muted">Все карты, которые хотя бы один раз выпадали игроку, остаются открытыми в коллекции. Если последний экземпляр проигран, карта остаётся открытой с пометкой «нет на руках» и не входит в БК.</p>`;

  h+=`<p class="muted">Боевая колода: ${bkList().length} из ${CFG.bkSize}. ${
    need
      ? `Карт на руках больше 50 — состав БК можно менять вручную. Отмечено ${S.bkPicked.length} из 50.`
      : `Все карты, которые реально есть на руках и не заблокированы, автоматически входят в БК.`
  }</p>`;

  h+=`<div class="dgrid collection-dgrid">`;
  [...Array(12).keys()].forEach(d=>{
    const ids=deckCards(d);
    const have=ids.filter(i=>S.opened[i]).length;
    const safeInDeck=ids.filter(i=>lockedSet.has(i)&&!S.opened[i]).length;
    const physical=ids.filter(i=>(S.copies[i]||0)>0).length;
    h+=`<div class="dtile${have===10?' full':''}">
      <i>${CFG.emoji[d]}</i><b>${CFG.animals[d]}</b>
      <span>${have}/10 открыто · ${physical} на руках${safeInDeck?` · 🔒${safeInDeck}`:''}</span>
      <u style="width:${have*10}%"></u>
    </div>`;
  });
  h+='</div>';

  h+=`<button class="fullbtn" onclick="toggleOpen('collFull')">
    ${OPEN.collFull?'Свернуть карты':'Показать все карты'}
    <span>${OPEN.collFull?'вернуться к сводке':`${uniq()} открыто · ${own} реально на руках`}</span>
  </button>`;

  if(OPEN.collFull){
    h+='<div class="fullcoll collection-compact">';
    [...Array(12).keys()].forEach((d,k)=>{
      const ids=deckCards(d);
      const have=ids.filter(i=>S.opened[i]).length;
      const physical=ids.filter(i=>(S.copies[i]||0)>0).length;

      h+=`<div class="fdeck${have===10?' full':''}">
        <div class="fdh">
          <span class="fnum">${k+1}</span>
          <i>${CFG.emoji[d]}</i><b>${CFG.animals[d]}</b>
          <span class="ftag">${have}/10 открыто · ${physical} на руках</span>
        </div>
        <div class="frow">`;

      ids.forEach(i=>{
        const c=CARDS[i];
        const opened=!!S.opened[i];
        const copies=S.copies[i]||0;
        const blocked=S.blocked.includes(i);
        const safe=lockedSet.has(i)&&!opened;

        if(safe){
          h+=`<div class="fc safe" title="${c.name}">
            <i>🔒</i><b>—</b><s>${c.name.split(': ')[1]}</s>
          </div>`;
          return;
        }

        if(!opened){
          h+=`<div class="fc miss" title="Карта ещё не открыта">
            <i>·</i><b>—</b><s>не открыта</s>
          </div>`;
          return;
        }

        const cls=`have ${c.rar}${copies===0?' nohand':''}${blocked?' blocked':''}`;
        const val=Math.max(...c.st);
        const count=copies>1?`<u>×${copies}</u>`:'';
        const nohand=copies===0?`<em class="fcnohand">нет на руках</em>`:'';

        let controls='';
        if(copies>0){
          controls+=`<button class="fcctl ${blocked?'on':''}" title="${blocked?'Разблокировать':'Заблокировать'}" onclick="event.stopPropagation();toggleBlock(${i})">${blocked?'🔒':'🔓'}</button>`;
          if(need && !blocked){
            const on=S.bkPicked.includes(i);
            controls+=`<button class="fcctl bk ${on?'on':''}" title="${on?'Убрать из БК':'Добавить в БК'}" onclick="event.stopPropagation();toggleBk(${i})">${on?'✓':'+'}</button>`;
          }

        h+=`<div class="fc ${cls}" title="${c.name}">
          <i>${CFG.emoji[c.deck]}</i><b>${val}</b><s>${c.name.split(': ')[1]}</s>
          ${count}${nohand}
          ${controls?`<div class="fccontrols">${controls}</div>`:''}
        </div>`;
      });

      h+='</div></div>';
    });
    h+='</div>';

    h+=`<p class="muted collection-actions-note">🔓/🔒 — защита карты от PvP. ${
      need ? 'Кнопка + / ✓ управляет составом БК, когда на руках больше 50 уникальных карт.' : 'Сейчас отдельный выбор состава БК не нужен.'
    }</p>`;
  }

  h+=`<p class="muted">Слотов блокировки куплено ${S.slots}/5, занято ${S.blocked.length}. ${
    S.slots<5?`<button onclick="buySlot()">Купить слот ${S.slots+1} за ${CFG.slotPrices[S.slots]} монет</button>`:''
  }</p>`;

  $('collection').innerHTML=h;
}

    const disabled=got||locked||rem<=0||S.coins<p.price;
    h+=`<button class="prize ${got?'got':''} ${locked?'locked':''}" onclick="buyPrize('${p.id}')" ${disabled?'disabled':''}>
      <b>${p.name}</b><div class="price">${p.price} монет</div>
      <small>${got?'Уже получено':(locked?`Станет доступно на ${p.unlockWeek}-й неделе`:`Доступно сейчас: ${rem}`)}</small>
      <small>${p.type}</small></button>`;
  });
  h+='</div>';
  const own=bonusOwnedList();
  h+=`<h3>Бонус-карты <span class="tag">${own.reduce((a,b)=>a+b.n,0)} шт.</span></h3><div class="bonuslist">`;
  own.sort((a,b)=>({C:0,R:1,L:2})[b.rar]-({C:0,R:1,L:2})[a.rar]);
  own.forEach(b=>{ h+=`<div class="bchip ${b.rar}" title="${b.desc}">${b.name} <i>×${b.n}</i></div>`; });
  if(!own.length) h+='<span class="muted">Пока нет</span>';
  h+='</div>';
  $('shop').innerHTML=h;
}

function slotMetrics(sl){
  const st=sl.S, stat=st.stat||{};
  const u=(st.opened||[]).filter(Boolean).length;
  const physical=(st.copies||[]).reduce((a,n)=>a+(n||0),0);
  const playable=CARDS.filter(c=>(st.copies[c.id]||0)>0 && !(st.blocked||[]).includes(c.id)).length;
  const bk=Math.min(CFG.bkSize,playable);
  const fills=[...Array(12).keys()].map(d=>CARDS.filter(c=>c.deck===d).filter(c=>st.opened[c.id]).length);
  const closed=fills.filter(f=>f===10).length;
  const bonusStock=Object.values(st.bonus||{}).reduce((a,n)=>a+(n||0),0);
  const matches=stat.matches||0, wins=stat.wins||0, losses=stat.losses||0, draws=stat.draws||0;
  const dups=(stat.dups||0);
  const order=(st.deckOrder||[]).map(d=>CFG.animals[d]).join(' → ');
  const modeGates={exp:5,cls:10,pro:15};
  const modeNames={exp:'Экспресс',cls:'Классика',pro:'Профи'};
  const pvpModes=Object.entries(CFG.modes)
    .filter(([k])=>bk>=modeGates[k])
    .map(([k])=>modeNames[k]).join(', ') || 'нет';
  return {
    u,physical,bk,closed,minDeck:Math.min(...fills),bonusStock,matches,wins,losses,draws,
    wr:matches?Math.round(wins/matches*100):0,
    dups,dupsPack:stat.dupsPack||0,dupsPvP:stat.dupsPvP||0,
    packs:st.packsBought||0,stars:st.stars||0,starsEarned:stat.starsEarned||0,
    coins:Math.round(st.coins||0),coinsEarned:stat.coinsEarned||0,coinsSpent:stat.coinsSpent||0,
    rating:st.rating||0,bonusUsed:stat.bonusUsed||0,
    roundsW:stat.rounds||0,roundsL:stat.roundsLost||0,roundsD:stat.roundDraws||0,
    cardsWon:stat.cardsWon||0,cardsLost:stat.cardsLost||0,
    daily:st.dailyDone||0,friends:st.friends||0,qr:st.qrUsed||0,
    modeGates,pvpModes,order
  };
}

      <b style="color:var(--acc2)">Точечное заполнение отстающей колоды <span class="muted">(механизм профиля 2)</span></b>
      <div class="muted" style="margin:4px 0">Каждая N-я новая карта выдаётся <b>не по лестнице</b>, а прямо в колоду с наименьшей заполненностью (при равенстве — та, что выше в очереди). Это гарантированная выдача, а не повышенный шанс: колода не может застрять пустой из-за невезения.<br>
      Заполненность считается по доступным картам, поэтому колода с картой в сейфе не висит вечно в отстающих.<br>
      N=0 — механизм выключен. N=3 — каждая третья карта, N=6 — каждая шестая (реже, мягче).</div>
      <div class="trow"><span>Каждая N-я карта — в самую пустую (0 — выкл)</span>
        <input type="range" min="0" max="10" step="1" value="${TUNE.fillEveryN}" oninput="setLag('fillEveryN',this.value)">
        <input class="tval tnum" id="tv_fillEveryN" type="text" inputmode="numeric" value="${TUNE.fillEveryN}" onchange="setLag('fillEveryN',this.value)"></div>
      <div class="trow"><span>Только если отстаёт от средней на (карт), 0 — всегда</span>
        <input type="range" min="0" max="6" step="1" value="${TUNE.fillMinGap}" oninput="setLag('fillMinGap',this.value)">
        <input class="tval tnum" id="tv_fillMinGap" type="text" inputmode="numeric" value="${TUNE.fillMinGap}" onchange="setLag('fillMinGap',this.value)"></div>
    </div>`;
  h+=`<table style="width:100%;border-collapse:collapse;font-size:12px">
      <tr class="muted"><td style="padding:4px">Ступень</td><td>Колод в группе</td><td>Доля группы</td><td>На каждую колоду</td><td></td></tr>`;
  const explicitCount = TUNE.ladderSteps.slice(0,-1).reduce((a,s)=>a+s.count,0);
  const lastDecks = Math.max(1, 12 - explicitCount);   // колод в «остатке» из 12
  TUNE.ladderSteps.forEach((st,i)=>{
    const last = i===TUNE.ladderSteps.length-1;
    const per = last ? (st.share/lastDecks*100).toFixed(1)+'%'
                     : (st.count>0 ? (st.share/st.count*100).toFixed(1)+'%' : '—');
    h+=`<tr>
      <td style="padding:4px">${i+1}${last?` (все остальные, ~<span id="lastDecksLbl">${lastDecks}</span> колод)`:''}</td>
      <td>${last?'<span class=muted>остаток</span>':`<input class="tnum" type="text" inputmode="numeric" value="${st.count}" style="width:56px" onchange="setStep(${i},'count',this.value)">`}</td>
      <td><input class="tnum" type="text" inputmode="decimal" value="${st.share}" style="width:70px" onchange="setStep(${i},'share',this.value)"></td>
      <td id="per_${i}">${per}</td>
      <td>${TUNE.ladderSteps.length>1&&!last?`<button onclick="delStep(${i})">✕</button>`:''}</td>
    </tr>`;
  });
  h+=`</table>
    <div class="tunebtns" style="margin-top:6px"><button onclick="addStep()">+ ступень</button></div>
    <div class="twarn" id="ladderwarn">${ladderWarn()}</div>
  </div>`;

  h+=`</div>`;
  h+=`<div class="tunebtns">
    <button class="primary" onclick="exportTune()">📥 Выгрузить параметры (JSON)</button>
    <button onclick="importTunePrompt()">📤 Загрузить параметры</button>
    <button onclick="resetTune()">Значения по умолчанию</button>
    <button onclick="toggleTune()">Свернуть</button>
  </div>
  <div class="muted" style="margin-top:6px">Базовые значения: первая колода — форс каждой 2-й новой карты, вторая после неё — каждой 3-й; дубли 70/20/10; достижение 125 монет за колоду; сейф 10 карт; весь запас бонусов в матче.</div>`;
  $('tunepanel').innerHTML=h;
}
function ladderWarn(){
  const s=ladderSum();
  return Math.abs(s-1)>0.001 ? `⚠ Сумма долей ступеней = ${s.toFixed(2)}. Должна быть 1,00 — иначе доли будут нормализованы при выдаче.` : '✓ Сумма долей = 1,00';
}
function decayHint(){
  const d=TUNE.decay;
  if(d===0) return 'Убыль выключена: пока колода не собрана, она держит полный вес, а в момент закрытия следующая резко получает его целиком.';
  if(d<0.4) return `Слабая убыль (${fmt(d)}): вес утекает вниз понемногу, переход между колодами чуть сглажен.`;
  if(d<0.8) return `Средняя убыль (${fmt(d)}): по мере сбора колода отдаёт заметную часть веса следующим — переход плавный, без скачка при закрытии.`;
  return `Сильная убыль (${fmt(d)}): почти собранная колода уже почти не тянет вес на себя, карты активно идут в следующие колоды.`;
}
// Разбор числа: принимает и точку, и запятую; пустая строка/мусор — не применяем
function num(v){
  if(v===null||v===undefined) return NaN;
  const s=String(v).trim().replace(',','.');
  if(!/^\d+(\.\d+)?$/.test(s)) return NaN;   // только законченное число, «0.» не применяем
  const n=parseFloat(s);
  return isFinite(n)?n:NaN;
}
// Пересчитывает только вычисляемые подписи (без перерисовки полей — иначе теряется фокус)
function refreshCalc(){
  const explicit=TUNE.ladderSteps.slice(0,-1).reduce((a,s)=>a+(+s.count||0),0);
  const lastDecks=Math.max(1,12-explicit);
  TUNE.ladderSteps.forEach((st,i)=>{
    const last=i===TUNE.ladderSteps.length-1;
    const per=last?(st.share/lastDecks*100):(st.count>0?st.share/st.count*100:0);
    const el=$('per_'+i); if(el) el.textContent=per.toFixed(1)+'%';
  });
  const lbl=$('lastDecksLbl'); if(lbl) lbl.textContent=lastDecks;
  const w=$('ladderwarn'); if(w) w.innerHTML=ladderWarn();
}
function setDecay(v){ const n=num(v); if(isNaN(n)) return; TUNE.decay=n; storeSlot(ACTIVE);
  const t=$('tv_decay'); if(t) t.value=n; const h=$('decay_hint'); if(h) h.innerHTML=decayHint(); renderSoon(); }
function setLag(key,v){ const n=num(v); if(isNaN(n)) return; TUNE[key]=n; storeSlot(ACTIVE);
  const t=$('tv_'+key); if(t) t.value=n; renderSoon(); }
function setNovelty(key,v){ const n=num(v); if(isNaN(n)) return; TUNE[key]=n; storeSlot(ACTIVE);
  const t=$('tv_'+key); if(t) t.value=n; renderSoon(); }
function setStep(i,field,v){
  const n=num(v); if(isNaN(n)) return;
  TUNE.ladderSteps[i][field] = field==='count'?Math.max(1,Math.round(n)):n; storeSlot(ACTIVE);
  refreshCalc(); renderSoon();          // без renderTune — поле не теряет фокус
}
// Перерисовку остального интерфейса откладываем, чтобы ввод не лагал
let _rt=null;
function renderSoon(){ clearTimeout(_rt); _rt=setTimeout(()=>render(), 250); }
function addStep(){ TUNE.ladderSteps.splice(TUNE.ladderSteps.length-1,0,{count:1,share:0.05}); storeSlot(ACTIVE); renderTune(); render(); }
function delStep(i){ TUNE.ladderSteps.splice(i,1); storeSlot(ACTIVE); renderTune(); render(); }
function fmt(v){ return (v%1===0)?v:(+v).toFixed(2); }
const TUNE_DEFAULT=JSON.parse(JSON.stringify(TUNE));
function resetTune(){
  // возвращаем параметры ИМЕННО этого варианта, а не общий стартовый набор
  Object.keys(TUNE).forEach(k=>{ delete TUNE[k]; });
  Object.assign(TUNE, variantTune(SLOTS[ACTIVE].v));
  storeSlot(ACTIVE); buildSafe(); renderTune(); render();
}
function exportTune(){
  const payload={ _meta:{game:'BabyFox Лесная лига', exported:new Date().toISOString(),
                        deckOrder:playerOrder().map(d=>CFG.animals[d])}, tune:TUNE };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='babyfox-params.json'; a.click();
  log('Параметры выгружены в babyfox-params.json','good');
}
function importTunePrompt(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); const t=d.tune||d;
      Object.keys(TUNE).forEach(k=>{ if(t[k]!==undefined) TUNE[k]=t[k]; });
      storeSlot(ACTIVE); buildSafe(); renderTune(); render(); log('Параметры загружены','good');
    }catch(err){ alert('Не удалось прочитать файл параметров'); } };
    r.readAsText(f); };
  inp.click();
}
function showTab(name){
  document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('on', el.dataset.s===name));
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on', el.dataset.t===name));
  window.scrollTo(0,0);
}
function paintAppbar(){
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  set('ab_day', S.day+'/60'); set('ab_cards', uniq()+'/120');
  set('ab_coins', Math.round(S.coins)); set('ab_stars', S.stars);

  const pe=document.getElementById('ab_profile');
  const v=SLOTS[ACTIVE]&&SLOTS[ACTIVE].v;
  if(pe&&v){
    pe.innerHTML=`<b>Профиль ${v.id}</b> · ${PROFILE_TOP[v.prof]} · ${NOV_SHORT[v.nov]}`;
  }
}
window.addEventListener('DOMContentLoaded',()=>{ initSlots(); render(); });

</script></body></html>
