<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BabyFox Лесная лига — DEMO · 4 profiles + PvP hand gates 5/10/15 · v59</title>
<style>
:root{
  --bg:#0E1310; --panel:#172019; --panel2:#1E2A21; --line:#2C3A2F;
  --ink:#EEE6D6; --muted:#8B9A8E; --acc:#E8892B; --acc2:#8DC96A;
  --c:#2F80ED; --r:#F2C94C; --l:#9B51E0;
  --appw:520px;              /* мобильная ширина макета */
}
/* На большом экране макет остаётся мобильным по смыслу, но расширяется в стороны */
*{box-sizing:border-box}
#tunepanel{position:relative;z-index:1;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--acc);padding:16px;max-height:none;overflow:visible}
#tunepanel h3{margin:0 0 4px}
.tunegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 22px}
.tsec{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.tsec b{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.trow{display:grid;grid-template-columns:1fr 120px 52px;align-items:center;gap:8px;margin-top:6px;font-size:12px}
.trow input[type=range]{width:100%}
.trow .tval{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
#profiletabs{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
#ptabs{margin-top:8px}
.ptrow2{margin-top:6px}
.ptab.sub{background:transparent;border-style:dashed}
.ptab.sub.on{background:rgba(232,137,43,.10);border-style:solid}
.ptab.sub b{color:var(--acc2)}
.ptrow{display:flex;gap:6px;flex-wrap:wrap}
.ptab{flex:1;min-width:190px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer;color:var(--ink);line-height:1.3}
.ptab.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.ptab b{display:block;font-size:11.5px;color:var(--acc);font-weight:600}
.ptab .m{font-size:11px;color:var(--muted);margin-top:1px;display:block}
.pdesc{font-size:12px;color:var(--muted);line-height:1.5}
.pdesc b{color:var(--ink)}
.autorow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tgl{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}
.tgl.on{border-color:var(--acc2);color:var(--ink);background:rgba(122,182,72,.12)}
.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.cmp td,.cmp th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp tr.on td{color:var(--acc)}
.usercmp{min-width:1850px;font-size:12px}
.usercmp th{position:sticky;top:0;background:var(--panel);z-index:1;white-space:nowrap}
.usercmp th:first-child,.usercmp td:first-child{position:sticky;left:0;background:var(--panel);z-index:2}
.usercmp td{padding:6px 7px;white-space:nowrap}
.usercmp td b{font-size:14px;color:var(--ink)}
.tnum{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;text-align:right}
.tnum:focus{outline:2px solid var(--acc);outline-offset:0}
input.tval{width:52px}
.tunebtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.twarn{color:var(--l);font-size:12px;margin-top:6px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#172019,#172019ee);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:16px;margin:0 0 8px;letter-spacing:.02em}
h1 span{color:var(--acc)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.hudrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.pill b{color:var(--ink)}
.pill.coin b{color:var(--acc)} .pill.star b{color:var(--l)}
.wrap{display:grid;grid-template-columns:1fr 1fr 340px;gap:14px;padding:14px;align-items:start}
@media(max-width:1200px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
button{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc);color:#fff}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#1a1206;font-weight:600}
.topbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.tag{font-weight:400;color:var(--muted);font-size:11px;text-transform:none;letter-spacing:0}
.task{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.task.ready{border-color:var(--acc2)}
.task.done{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px}
button.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:180px;text-align:left;padding:8px 12px}
button.mode b{font-size:14px}
button.mode span{font-size:12px;color:var(--muted)}
.deck{margin-bottom:10px}
.dh{margin-bottom:4px}
.deck.full .dh b{color:var(--acc2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.chip{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:5px 7px;font-size:11px}
.chip.R{border-left-color:var(--r)} .chip.L{border-left-color:var(--l)}
.chip.ghost{opacity:.25}
.chip b{display:block;font-size:11px;font-weight:600}
.chip .st{color:var(--muted);font-size:10px}
.chip .cnt{position:absolute;top:4px;right:24px;color:var(--acc);font-style:normal;font-size:11px}
.lock{position:absolute;top:2px;right:2px;padding:1px 4px;font-size:11px;background:none;border:none}
.lock.on{color:var(--acc)}
.bkpick{position:absolute;top:2px;right:22px;padding:1px 4px;font-size:10px;background:none;border:none;color:var(--muted)}
.bkpick.on{color:var(--acc2)}
.mhead{font-size:15px;margin-bottom:8px}
.turn{background:var(--panel2);border:1px solid var(--acc);border-radius:7px;padding:7px 10px;margin-bottom:8px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:8px}
.hcard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:8px}
.hcard.R{border-left-color:var(--r)} .hcard.L{border-left-color:var(--l)}
.hcard .stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.stat{font-size:11px;padding:4px 6px;text-align:left}
.stat.hl{border-color:var(--acc);color:var(--acc)}
.stat.flat{border:1px dashed var(--line);color:var(--muted);border-radius:7px;padding:4px 6px;font-size:11px}
.answer{width:100%;margin-top:6px;border-color:var(--acc);color:var(--acc)}
.bonusbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:8px}
.bchip{font-size:11px;padding:8px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--c);
  flex:0 0 152px;width:152px;scroll-snap-align:start;overflow:hidden}
.bchip.R{color:var(--r)} .bchip.L{color:var(--l)}
.bchip.sel{border-color:var(--acc);background:#3a2a14;color:#fff}
.bchip i{font-style:normal;color:var(--muted)}
.bonuslist{display:flex;flex-wrap:wrap;gap:5px}
.mlog{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.mres{padding:8px 10px;border-radius:7px;background:var(--panel2);margin-bottom:8px}
.mres.good{border:1px solid var(--acc2)} .mres.bad{border:1px solid #b4553a}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:3px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right}
.le{font-size:12px;padding:3px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.le span{color:#6d6058;margin-right:6px}
.le.good{color:var(--acc2)} .le.warn{color:#d99}

/* ===== Панель запаса бонус-карт ===== */
.blist{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto;margin-top:6px}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 8px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--line)}
.brow.C{border-left-color:var(--c)} .brow.R{border-left-color:var(--r)} .brow.L{border-left-color:var(--l)}
.brow .bn{font-weight:600;font-size:12.5px}
.brow .bq{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;align-self:start}
.brow .bd{grid-column:1/-1;font-size:11.5px;color:var(--muted);line-height:1.35}

/* ===== Игровой экран ===== */
.arena-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.score{font-size:26px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.score .me{color:var(--acc2)} .score .op{color:#d9705a} .score .sep{color:var(--muted);margin:0 4px}
.minfo{flex:1;min-width:160px;font-size:13px}
.timer{display:flex;align-items:baseline;gap:5px}
.clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.hot{color:#e8544a}
.tbarwrap{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.tbar{height:100%;width:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .95s linear}

.side{margin:8px 0 4px}
.sidelbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.backs{display:flex;gap:5px;flex-wrap:wrap}
.back{width:32px;height:46px;border-radius:6px;border:1px solid #4a3d31;
  background:repeating-linear-gradient(135deg,#2b2018 0 5px,#332619 5px 10px)}

.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:8px 0}
.acard{border-radius:10px;padding:8px 10px;background:var(--panel);border-left:3px solid var(--line)}
.acard.C{border-left-color:var(--c)} .acard.R{border-left-color:var(--r)} .acard.L{border-left-color:var(--l)}
.acard .an{font-size:11.5px;color:var(--muted)}
.acard .av{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.acard .ab{font-size:11px;color:var(--acc)}
.amid{text-align:center;min-width:104px}
.amid .astat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.rwin{color:var(--acc2);font-weight:600;font-size:12.5px}
.rlose{color:#e8544a;font-weight:600;font-size:12.5px}
.rdraw{color:var(--muted);font-weight:600;font-size:12.5px}

.turn{padding:8px 10px;border-radius:9px;font-size:13px;margin:6px 0}
.turn.mine{background:rgba(122,182,72,.12);border:1px solid var(--acc2)}
.turn.theirs{background:rgba(232,137,43,.10);border:1px solid var(--acc)}

.hcard .hname{font-size:12px;font-weight:600;margin-bottom:5px;line-height:1.25}
.hcard .stats{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.stat{display:flex;justify-content:space-between;gap:6px;padding:4px 6px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11px;cursor:pointer}
.stat b{font-variant-numeric:tabular-nums}
.stat:hover{border-color:var(--acc)}
.stat.flat{cursor:default}
.stat.best{border-color:#5c4a36}
.stat.hot{border-color:var(--acc);background:rgba(232,137,43,.14);font-weight:600}
.answer{width:100%;margin-top:6px;background:var(--acc2);color:#10240a;border:0;border-radius:7px;padding:5px;font-weight:600;cursor:pointer}
.bchip em{display:block;font-style:normal;font-size:10px;color:var(--muted);margin-top:3px;
  white-space:normal;word-break:break-word;hyphens:auto}
.bchip{text-align:left;line-height:1.3;font-weight:600}


.rdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.rdot.C{background:var(--c)} .rdot.R{background:var(--r)} .rdot.L{background:var(--l);box-shadow:0 0 6px var(--l)}
.rlbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px}
.rlbl.L{color:var(--l)} .rlbl.R{color:var(--r)}
.hcard.L{box-shadow:inset 0 0 0 1px rgba(232,178,58,.35)}
.hist{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px 10px;margin:10px 0}
.histh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.hrow{display:grid;grid-template-columns:22px 74px 1fr 84px 1fr 150px;gap:8px;align-items:center;
  padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.hrow:first-of-type{border-top:0}
.hrow .hn{color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .hs{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hrow .hc b{font-variant-numeric:tabular-nums;margin-left:4px}
.hrow .hc em{font-style:normal;color:var(--acc);font-size:11px}
.hrow .hl{font-size:11px;color:var(--muted);text-align:right}
@media(max-width:900px){.hrow{grid-template-columns:20px 1fr 1fr;grid-auto-flow:row}.hrow .hl,.hrow .hs{grid-column:1/-1}}


.reveal{border:1px solid var(--acc);border-radius:12px;padding:12px;background:rgba(232,137,43,.06)}
.rvhead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.rvhint{font-size:12.5px;color:var(--ink);margin:10px 0 6px}
.bchip.decides{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset}
.bchip.useless{opacity:.45}
.bchip.best{border-color:var(--acc);background:rgba(232,137,43,.10)}
.qbox{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:8px 0 12px;background:var(--panel2)}
.qhead{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:7px}
.qhead em{font-style:normal;text-transform:none;letter-spacing:0;margin-left:6px;opacity:.75}
.panel.fold{padding:0;overflow:hidden}
.fhead{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;
  padding:13px 14px;color:var(--ink);font-size:13.5px;text-align:left;cursor:pointer}
.fhead:hover{background:rgba(255,255,255,.03)}
.fhead b{font-weight:700;flex:1}
.fchev{display:inline-block;color:var(--acc);font-size:16px;line-height:1;transition:transform .16s ease;transform:rotate(0)}
.fchev.on{transform:rotate(90deg)}
.fright{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel.fold>*:not(.fhead){margin-left:14px;margin-right:14px}
.panel.fold>*:last-child{margin-bottom:14px}
.hgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:11px 0 9px}
.hgrid>div{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:9px;padding:6px 3px;text-align:center}
.hgrid b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.hgrid b span{font-size:9px;color:var(--muted);font-weight:600}
.hgrid>div>span{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.hsw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.swch{display:flex;align-items:center;gap:6px;font-size:11px;padding:6px 9px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.swch i{width:22px;height:12px;border-radius:999px;background:#3a332c;position:relative;flex:none;transition:background .15s}
.swch i::after{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;
  background:#8a8078;transition:transform .15s,background .15s}
.swch.on{color:var(--ink);border-color:var(--acc)}
.swch.on i{background:rgba(232,137,43,.45)}
.swch.on i::after{transform:translateX(10px);background:var(--acc)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.dtile{position:relative;border:1px solid var(--line);border-radius:10px;padding:7px 4px 9px;
  text-align:center;background:rgba(0,0,0,.2);overflow:hidden}
.dtile i{font-style:normal;font-size:19px;display:block;line-height:1.1}
.dtile b{display:block;font-size:10px;margin-top:2px}
.dtile span{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dtile u{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);text-decoration:none}
.dtile.full{border-color:var(--acc2)} .dtile.full u{background:var(--acc2)}
@media(max-width:400px){ .hgrid{grid-template-columns:repeat(3,1fr)} .dgrid{grid-template-columns:repeat(3,1fr)} }
.hmain{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.hnext,.hplay{padding:14px 10px;border-radius:11px;font-size:14px;font-weight:700;border:0;cursor:pointer}
.hnext{background:linear-gradient(180deg,#f0912e,#d2731a);color:#241202}
.hplay{background:linear-gradient(180deg,#d94b3a,#a8301f);color:#fff;
  box-shadow:0 3px 12px rgba(200,55,35,.28)}
.hplay:active,.hnext:active{transform:translateY(1px)}
.hnext:disabled,.hplay:disabled{background:var(--panel2);color:var(--muted);cursor:default;box-shadow:none}
.fullbtn{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer}
.fullbtn span{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:2px}
.fullcoll{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.fdeck{border:1px solid var(--line);border-radius:11px;padding:8px 9px 9px;background:rgba(0,0,0,.18)}
.fdeck.full{border-color:var(--acc2)}
.fdh{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.fdh i{font-style:normal;font-size:16px}
.fdh b{font-size:12px}
.fnum{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 4px;
  font-variant-numeric:tabular-nums}
.ftag{margin-left:auto;font-size:10px;color:var(--muted)}
.frow{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.fc{position:relative;border:1px solid var(--line);border-radius:7px;padding:4px 2px 3px;text-align:center;
  background:rgba(0,0,0,.25);line-height:1.15;overflow:hidden}
.fc i{font-style:normal;font-size:13px;display:block}
.fc b{display:block;font-size:10px;font-variant-numeric:tabular-nums}
.fc s{display:block;text-decoration:none;font-size:7px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc u{position:absolute;top:1px;right:2px;text-decoration:none;font-size:7.5px;color:var(--acc)}
.fc.have.C{border-color:rgba(143,165,184,.5)}
.fc.have.R{border-color:rgba(169,136,214,.6)}
.fc.have.L{border-color:rgba(232,178,58,.7);background:rgba(232,178,58,.08)}
.fc.miss{opacity:.4} .fc.miss b{color:var(--muted)}
.fc.safe{border-style:dashed;border-color:#4a6a8a;opacity:.75}
@media(max-width:460px){ .frow{grid-template-columns:repeat(5,1fr)} .fc s{font-size:7.5px} }
.hswhead{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:12px 0 6px}
.numsw{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.numsw button{padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--muted);font-size:11px;cursor:pointer}

  background:linear-gradient(200deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 38%)}
.card3d:active{transform:translateY(1px) scale(.985)}

/* ===== Battle UX v4: visual bottom fan carousel ===== */
.gopp{margin-bottom:4px}
.goppbar{display:flex;align-items:center;justify-content:center;gap:9px;min-height:58px}
.gbacks{flex-wrap:nowrap;overflow:hidden;max-width:calc(100% - 92px);justify-content:flex-start}
.roundstat{
  flex:0 0 auto;min-width:74px;padding:7px 8px;border-radius:10px;
  border:1px solid var(--acc);background:rgba(232,137,43,.12);text-align:left
}
.roundstat span{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.roundstat b{display:block;font-size:12px;line-height:1.15;color:var(--ink);margin-top:2px}

/* Рука — настоящий веер у нижней кромки экрана */
.ghand{
  display:flex!important;grid-template-columns:none!important;
  align-items:flex-end;gap:0;
  overflow-x:auto;overflow-y:visible;
  scroll-snap-type:x mandatory;
  padding:48px 18vw 10px;
  margin:-14px -12px 2px;
  min-height:248px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  perspective:900px
}
.ghand::-webkit-scrollbar{display:none}

.fanitem{
  flex:0 0 58%;
  max-width:205px;
  min-width:160px;
  scroll-snap-align:center;
  position:relative;
  margin-left:-48px;
  transform-origin:50% 100%;
  opacity:.82;
  z-index:1;
  transition:transform .22s ease,opacity .18s ease,filter .18s ease,margin .22s ease
}
.fanitem:first-child{margin-left:0}

.fanitem .pcard{
  min-height:132px;
  border-radius:12px;
  transform:scale(.68);
  transform-origin:50% 100%;
  transition:transform .22s ease,box-shadow .22s ease;
  box-shadow:0 7px 18px rgba(0,0,0,.28)
}
.fanitem .pcard .pname{font-size:10px}
.fanitem .pcard .pface{height:32px;font-size:20px}
.fanitem .pcard .pstat{font-size:8px;padding:3px 6px}
.fanitem .pcard .pstat b{font-size:10px}
.fanitem .pcard .prar{font-size:7px}

/* Карты вокруг центра расходятся веером */
.fanitem[data-fan="-3"]{transform:translateY(28px) rotate(-16deg)}
.fanitem[data-fan="-2"]{transform:translateY(17px) rotate(-10deg)}
.fanitem[data-fan="-1"]{transform:translateY(8px) rotate(-5deg)}
.fanitem[data-fan="1"]{transform:translateY(8px) rotate(5deg)}
.fanitem[data-fan="2"]{transform:translateY(17px) rotate(10deg)}
.fanitem[data-fan="3"]{transform:translateY(28px) rotate(16deg)}

.fanitem.active{
  z-index:10;
  opacity:1;
  margin-left:-24px;
  margin-right:24px;
  transform:translateY(-18px) rotate(0deg) scale(1.02)
}
.fanitem.active .pcard{
  transform:scale(1.28);
  box-shadow:0 16px 38px rgba(0,0,0,.48)
}
.fanitem.active .pcard .pname{font-size:14px}
.fanitem.active .pcard .pface{height:46px;font-size:29px}
.fanitem.active .pcard .pstat{font-size:10px;padding:4px 8px}
.fanitem.active .pcard .pstat b{font-size:14px}
.fanitem.active .pcard .prar{font-size:9px}

.fanitem.fit .pcard{box-shadow:0 0 0 2px rgba(122,182,72,.62),0 8px 24px rgba(0,0,0,.35)}
.fanitem.fit::after{
  content:"подходит";position:absolute;right:2px;top:18px;z-index:16;
  font-size:7px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:#dff3ce;background:#34512b;border:1px solid #6b9a4f;border-radius:999px;padding:2px 5px
}
.fanitem.best::after{content:"лучший";background:#573b18;border-color:var(--acc);color:#ffd9a2}
.carouselhint{text-align:center;font-size:10px;color:var(--muted);margin:-8px 0 6px}

.bonusdecision{
  border:1px solid var(--line);background:rgba(0,0,0,.16);border-radius:12px;padding:9px;margin-top:8px
}
.bonusdecision.pending{border-color:#795f39}
.bonusdecision.done{border-color:#456a38}
.bonusdecision .bdtitle{font-size:12px;font-weight:800;margin-bottom:2px}
.bonusdecision .bdsub{font-size:10.5px;color:var(--muted);line-height:1.35}
.bonusactions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.bonusactions button{padding:10px 8px;border-radius:10px}
.gbtn:disabled{opacity:.38;cursor:not-allowed;filter:grayscale(.25)}
.gbonus{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:9px}
.gbonus .bchip{flex:0 0 168px;width:168px;scroll-snap-align:start}
.gbonus .bchip.fit{border-color:#587c42}
.gbonus .bchip.best{box-shadow:0 0 0 1px var(--acc) inset}

  .fanitem.active .pcard{transform:scale(1.25)}
  .gbacks{max-width:calc(100% - 82px)}

}

/* ===== battle board v2: opponent stack + two play slots ===== */
.gopp{margin-bottom:8px!important}
.goppbar{display:flex!important;flex-direction:column;gap:7px!important;min-height:auto!important}
.opstack{position:relative;width:72px;height:58px;margin:0 auto}
.opstack .gback{position:absolute;width:42px;height:58px;left:15px;top:0}
.opstack .gback:nth-child(1){transform:translate(-8px,4px) rotate(-5deg);opacity:.62}
.opstack .gback:nth-child(2){transform:translate(-4px,2px) rotate(-2deg);opacity:.8}
.opstack .gback:nth-child(3){transform:none;opacity:1}
.opstack .stackcount{position:absolute;right:-7px;bottom:-5px;z-index:5;min-width:25px;height:25px;padding:0 6px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:11px;font-weight:900}
.playboard{display:grid;grid-template-columns:1fr 58px 1fr;gap:8px;align-items:center;margin:8px 0 10px;padding:10px;border:1px solid var(--line);border-radius:15px;background:rgba(0,0,0,.18)}
.playslot{position:relative;min-height:154px;border:1px dashed #625649;border-radius:13px;display:flex;align-items:center;justify-content:center;padding:7px;background:rgba(255,255,255,.018);overflow:hidden}
.playslot .slotlabel{position:absolute;left:7px;top:6px;font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);z-index:4}
.playslot.me .slotlabel{color:var(--acc2)}
.playslot .slotempty{font-size:10px;color:var(--muted);text-align:center;line-height:1.35}
.slotback{width:82px;height:118px;border-radius:11px;border:1px solid #5b4937;background:repeating-linear-gradient(135deg,#2e2219 0 8px,#3a2b1c 8px 16px);box-shadow:0 8px 20px rgba(0,0,0,.35);animation:slotDrop .2s ease-out}
.slotopen{width:100%;animation:slotFlip .90s ease-out}
.slotopen .pcard{min-height:136px!important}
.slotopen .pcard .pface{height:36px!important;font-size:22px!important}
.slotopen .pcard .pname{font-size:10px!important}
.slotopen .pcard .pstat{font-size:7.5px!important;padding:3px 4px!important}
.slotopen .pcard .pstat b{font-size:10px!important}
.slotresult{position:absolute;right:6px;top:6px;z-index:8;padding:3px 6px;border-radius:999px;font-size:8px;font-weight:900;text-transform:uppercase}
.slotresult.win{background:#355a2d;color:#e3f7d8}.slotresult.lose{background:#63352e;color:#ffd9d3}.slotresult.draw{background:#495057;color:#eef1f3}
.boardmid{text-align:center}.boardmid .roundstat{margin:0 auto;min-width:54px!important;padding:6px!important}.boardmid .versus{font-size:9px;color:var(--muted);margin-top:5px}
.revealnote{text-align:center;font-size:11px;font-weight:800;margin:2px 0 8px}.revealnote.win{color:var(--acc2)}.revealnote.lose{color:#e8544a}.revealnote.draw{color:var(--muted)}
@keyframes slotDrop{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}@keyframes slotFlip{0%{transform:rotateY(90deg);opacity:.2}100%{transform:rotateY(0);opacity:1}}

function noveltyChanceBy(frac){
  if(frac<0.30) return TUNE.noveltyStart;
  if(frac<0.60) return TUNE.novelty30;
  if(frac<0.85) return TUNE.novelty60;
  return TUNE.novelty85;
}
// Вес выбора для колоды на позиции rank в очереди открытых колод — по ступеням лестницы.
// Вес выбора для колоды на позиции rank в очереди из nOpen открытых колод.
// Последняя ступень («все остальные») делит свою долю на реальное число колод,
// попавших в неё, а не на служебный count — иначе дальним колодам достаются крохи.
function ladderRankWeight(rank, nOpen){
  const steps=TUNE.ladderSteps;
  let acc=0;
  for(let i=0;i<steps.length-1;i++){
    const st=steps[i];
    if(rank < acc + st.count) return st.share / st.count;
    acc += st.count;
  }
  // последняя ступень покрывает все позиции с acc и дальше
  const last=steps[steps.length-1];
  const remaining=Math.max(1, (nOpen!==undefined?nOpen:acc+1) - acc);
  return last.share / remaining;
}

function burnDuplicatesForStars(price){
  if(S.stars<price) return false;
  const cnt={1:0,2:0,3:0};
  S.copies.forEach((n,i)=>cnt[CFG.starValue[CARDS[i].rar]]+=Math.max(0,n-1));
  let best=null;
  for(let x3=0;x3<=Math.min(cnt[3],Math.floor(price/3));x3++){
    for(let x2=0;x2<=Math.min(cnt[2],Math.floor((price-3*x3)/2));x2++){
      const x1=price-3*x3-2*x2;
      if(x1<0||x1>cnt[1]) continue;
      const score=x3*10000+x2*100+x1; // бережём легендарные и редкие дубли
      if(!best||score<best.score) best={1:x1,2:x2,3:x3,score};
    }
  }
  if(!best) return false;
  [1,2,3].forEach(v=>{
    let need=best[v];
    for(let i=0;i<S.copies.length&&need>0;i++){
      if(CFG.starValue[CARDS[i].rar]!==v) continue;
      const take=Math.min(need,Math.max(0,S.copies[i]-1));
      if(take){ S.copies[i]-=take; need-=take; }
    }
  });
  S.stars-=price; S.stat.dupsBurned=(S.stat.dupsBurned||0)+(best[1]+best[2]+best[3]);
  return true;
}

function bkDensity(list){
  const b=list||bkList(); if(!b.length) return 0;
  return b.reduce((a,c)=>a+c.st.reduce((x,y)=>x+y,0),0)/b.length/400;

function combatVector(list,handSize=5){
  if(!list.length) return [0,0,0,0];
  const k=Math.max(1,Math.min(list.length,handSize*2));
  return [0,1,2,3].map(si=>{
    const v=list.map(c=>c.st[si]).sort((a,b)=>b-a).slice(0,k);
    return v.reduce((a,b)=>a+b,0)/v.length;
  });
}
function combatGap(a,b,handSize=5){
  const x=combatVector(a,handSize), y=combatVector(b,handSize);
  return Math.max(...x.map((v,i)=>Math.abs(v-y[i])/Math.max(1,(v+y[i])/2)));
}

/* ================= ВЫДАЧА КАРТЫ ================= */
function noveltyChance(){ return noveltyChanceBy(uniq()/120); }
function pickNewCard(){ // возвращает индекс карты или null
  const locked=safeLocked();
  // Первая колода должна закрываться быстро, но не раньше 3-го дня по финальному коридору 3–8 дней.
  // Если до минимального дня в ней осталась одна карта, временно придерживаем только эту последнюю карту.
  const firstDeckNow=playerOrder()[0];
  const firstMissingNow=deckCards(firstDeckNow).filter(id=>!S.opened[id] && !locked.includes(id));
  const holdEarlyFirst=(TUNE.firstDeckMinDay>0 && S.day<TUNE.firstDeckMinDay && firstMissingNow.length===1) ? firstMissingNow[0] : null;
  const free=id=>!S.opened[id] && !locked.includes(id) && id!==holdEarlyFirst;
  const all=[]; for(let i=0;i<120;i++) if(free(i)) all.push(i);
  if(!all.length) return null;
  // Все новые карты идут «в колоду» по ФИКСИРОВАННОЙ очереди и ступеням лестницы.
  // (Хвостовая ступень раздаёт карты по дальним колодам — она заменяет прежнюю случайную раскладку.)
  const openDecks=[];
  playerOrder().forEach(d=>{ const miss=deckCards(d).filter(free); if(miss.length) openDecks.push({d,miss}); });
  if(!openDecks.length) return all[Math.floor(Math.random()*all.length)];
  const nOpen=openDecks.length;
  // ── Ускоренный старт очереди ──
  // Первая колода собирается быстрее: каждая N-я новая карта форсится в неё.
  // После её закрытия тот же механизм мягче работает только для ВТОРОЙ колоды очереди.
  // Если вторая уже закрылась естественно раньше первой — после закрытия первой форс выключается.
  const ord=playerOrder();
  const firstDeck=ord[0], secondDeck=ord[1];
  const firstOpen=!deckClosed(firstDeck), secondOpen=!deckClosed(secondDeck);
  const firstObj=openDecks.find(o=>o.d===firstDeck), secondObj=openDecks.find(o=>o.d===secondDeck);
  if(firstOpen && firstObj && TUNE.firstForceEvery>0){
    S.firstForceCount=(S.firstForceCount||0)+1;
    if(S.firstForceCount % TUNE.firstForceEvery === 0){
      return firstObj.miss[Math.floor(Math.random()*firstObj.miss.length)];
    }
  } else if(!firstOpen && secondOpen && secondObj && TUNE.secondForceEvery>0){
    S.secondForceCount=(S.secondForceCount||0)+1;
    if(S.secondForceCount % TUNE.secondForceEvery === 0){
      return secondObj.miss[Math.floor(Math.random()*secondObj.miss.length)];
    }
  }
  // ── Каждая N-я новая карта — полностью случайная среди всех доступных ──
  if(TUNE.randomEveryN>0){
    S.randCount=(S.randCount||0)+1;
    if(S.randCount % TUNE.randomEveryN === 0) return all[Math.floor(Math.random()*all.length)];
  }
  // ── Точечное заполнение отстающей колоды ──
  // Каждая N-я новая карта идёт не по лестнице, а в колоду с наименьшей заполненностью.
  // Заполненность считается по ДОСТУПНЫМ картам (карта в сейфе не делает колоду вечно отстающей).
  // fillMinGap=0 — срабатывает всегда; иначе нужно отставание от средней не меньше указанного.
  if(TUNE.fillEveryN>0){
    S.newCount=(S.newCount||0)+1;
    if(S.newCount % TUNE.fillEveryN === 0){
      const info=openDecks.map(o=>{
        const avail=deckCards(o.d).filter(i=>!locked.includes(i)).length;   // доступно всего
        const have=deckCards(o.d).filter(i=>S.opened[i]).length;            // уже открыто
        return {o, have, ratio: avail>0 ? have/avail : 1};
      });
      const avgHave=info.reduce((a,x)=>a+x.have,0)/(info.length||1);
      let best=info[0];
      info.forEach(x=>{ if(x.ratio < best.ratio) best=x; });                // при равенстве — выше в очереди
      if(TUNE.fillMinGap<=0 || (avgHave - best.have) >= TUNE.fillMinGap){
        return best.o.miss[Math.floor(Math.random()*best.o.miss.length)];
      }
    }
  }
  let w=openDecks.map((o,k)=>{
    let x=ladderRankWeight(k, nOpen);
    if(o.miss.length<=2) x*=TUNE.finishLe2;
    else if(o.miss.length<=4) x*=TUNE.finishLe4;
    return x;
  });
  // Коэффициент убыли: чем ближе колода к сборке, тем больше её веса утекает вниз.
  // filled/10 — доля собранного; срезанное перераспределяется на остальные открытые колоды
  // пропорционально их текущему весу. decay=0 — выключено (резкий переход при закрытии),
  // decay=1 — почти собранная колода почти не тянет вес на себя, переход плавный.
  if(TUNE.decay>0){
    let freed=0;
    w=w.map((x,k)=>{ const filled=10-openDecks[k].miss.length; const cut=x*(filled/10)*TUNE.decay; freed+=cut; return x-cut; });
    const wsum=w.reduce((a,b)=>a+b,0)||1;
    w=w.map(x=> x + freed*(x/wsum));   // излишек делим пропорционально остаточным весам
  }
  const sum=w.reduce((a,b)=>a+b,0); let r=Math.random()*sum;
  let pick=openDecks[0];
  for(let k=0;k<openDecks.length;k++){ r-=w[k]; if(r<=0){ pick=openDecks[k]; break; } }
  return pick.miss[Math.floor(Math.random()*pick.miss.length)];
}
function pickDup(rarForce){
  const rar = rarForce || (()=>{const s=TUNE.dupC+TUNE.dupR+TUNE.dupL||1; const r=Math.random()*s; return r<TUNE.dupC?'C':(r<TUNE.dupC+TUNE.dupR?'R':'L');})();
  let own=CARDS.filter(c=>S.opened[c.id] && c.rar===rar);
  if(!own.length) own=CARDS.filter(c=>S.opened[c.id]);
  if(!own.length) return null;
  return own[Math.floor(Math.random()*own.length)].id;
}
function pickNewCardByRarity(rar){
  const locked=safeLocked();
  const pool=CARDS.filter(c=>c.rar===rar && !S.opened[c.id] && !locked.includes(c.id));
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)].id;
}
// forceNew — стартовые паки; guarantee — 'new' | 'rare' | null
function grantCard(forceNew=false, guarantee=null){
  const atCap = uniq()>=cap();
  let id=null, isNew=false;
  // Гарантия Rare имеет приоритет над новизной: сначала новая Rare, затем Rare-дубль.
  if(guarantee==='rare'){
    if(!atCap){ const p=pickNewCardByRarity('R'); if(p!==null){ id=p; isNew=true; } }
    if(id===null) id=pickDup('R');
  }
  // ВАЖНО: индекс карты может быть 0, поэтому проверяем строго на null.
  if(id===null && (forceNew||guarantee==='new') && !atCap){ const p=pickNewCard(); if(p!==null){ id=p; isNew=true; } }
  if(id===null && guarantee!=='rare' && !atCap && Math.random()<noveltyChance()){ const p=pickNewCard(); if(p!==null){ id=p; isNew=true; } }
  if(id===null){
    id=pickDup(null);
    if(id===null){ // совсем нечего выдать — компенсация
      addBonus(2); log('Гарантия невыполнима — компенсация 2 бонус-картами','warn'); return null;
    }
  }
  S.stat.cardsGotToday++; S.today.cardsGot++;
  if(isNew){ S.opened[id]=true; S.copies[id]=1; S.stat.newCards++; S.stat.newCardsToday++; S.today.newCards++; S.week.newCards++; }
  else if(S.copies[id]===0){ S.copies[id]=1; }
  else { S.copies[id]++; S.stat.dups++; S.stat.dupsPack++; const v=CFG.starValue[CARDS[id].rar]; S.stars+=v; S.stat.starsEarned+=v; }
  return {id,isNew};
}

function openPack(n=5,opts={}){
  const got=[];

  const guarantee=opts.guarantee||null;

function buySlot(){
  if(S.slots>=5) return;
  const price=CFG.slotPrices[S.slots];
  if(S.coins<price){ log('Недостаточно монет','warn'); render(); return; }
  if(!spendCoins(price,'слоты блокировки')) return; S.slots++; S.today.slotsBought++;
  log(`Куплен слот блокировки ${S.slots} за ${price} монет`,'good'); render();
}
function toggleBlock(id){
  const i=S.blocked.indexOf(id);
  if(i>=0){ S.blocked.splice(i,1); }
  else{ if(S.blocked.length>=S.slots){ log('Все слоты блокировки заняты','warn'); render(); return; } S.blocked.push(id); S.today.blocked++; }
  render();
}
function shopWeek(){ return Math.max(1,Math.min(8,Math.ceil(Math.max(1,S.day)/7))); }
function prizeReleased(p){
  const w=shopWeek(); if((p.unlockWeek||1)>w) return 0;
  return p.stockByWeek.slice(0,w).reduce((a,b)=>a+b,0);
}
function prizeRemaining(p){ return Math.max(0,prizeReleased(p)-(S.prizes[p.id]||0)); }
function buyPrize(id){
  const p=CFG.shop.find(x=>x.id===id); if(!p) return;
  if((S.prizes[id]||0)>=1){ log('Эту позицию уже покупали — лимит 1 на аккаунт за сезон','warn'); render(); return; }
  if((p.unlockWeek||1)>shopWeek()){ log(`Позиция откроется на ${p.unlockWeek}-й неделе`,'warn'); render(); return; }
  if(prizeRemaining(p)<=0){ log('Партия этой позиции закончилась','warn'); render(); return; }
  if(!spendCoins(p.price,'витрина')){ log('Недостаточно монет','warn'); render(); return; }
  S.prizes[id]=1;
  log(`Куплено: ${p.name} за ${p.price} монет`,'good'); render();
}

function useSlot(i){
  ACTIVE=i;
  Object.keys(TUNE).forEach(k=>{ delete TUNE[k]; });
  Object.assign(TUNE, JSON.parse(JSON.stringify(SLOTS[i].tune)));
  S=SLOTS[i].S;
  buildSafe();          // у каждого варианта своя очередь колод, сейф пересчитывается
}
function storeSlot(i){ SLOTS[i].S=S; SLOTS[i].tune=JSON.parse(JSON.stringify(TUNE)); }
function initSlots(){
  SLOTS=VARIANTS.map(v=>({v, tune:variantTune(v), S:null}));
  // Каждый вариант моделирует отдельного игрока, поэтому у 1A / 1B / 2A / 2B
  // своя независимая случайная последовательность первых шести колод.
  // Последние шесть колод фиксированы для всех: Сова → Олень → Волк → Бобр → Медведь → Лис.
  SLOTS.forEach(sl=>{ S=newState(); sl.S=S; });
  useSlot(0); M=null;
}
function switchTo(i){ storeSlot(ACTIVE); M=null; useSlot(i); render();
  // панель параметров живёт отдельно от render() — перерисовываем её,
  // иначе в полях остаются значения предыдущего варианта
  if($('tunepanel').style.display!=='none') renderTune();
}

/* ===== Автоматический матч (для фонового прогона дня) ===== */

function simBonusPick(types,used,statIdx,cardId){
  if(Math.random()>=CFG.botBonusRate) return null;
  const usedSet=new Set(used||[]);
  const list=(types||[])
    .filter(i=>!usedSet.has(i) && BONUS[i])
    .map(i=>{
      const b=BONUS[i];
      const g=Math.round(bonusScore(b,statIdx,cardId));
      const cost={C:0,R:1,L:2};
      return {i,b,g,score:g*(b.rar==='L'?0.3:1),cost:cost[b.rar]};
    })
    .filter(x=>x.g>0);
  if(!list.length) return null;
  list.sort((a,b)=>(b.score-a.score)||(a.cost-b.cost));
  return list[0].i;
}

function simResolveRound(myCard,botCard,initialStat,myBonusIdx,botBonusIdx){
  const side=[
    {card:myCard, bonus:myBonusIdx!==null&&myBonusIdx!==undefined?BONUS[myBonusIdx]:null, add:0,mul:1,shield:false},
    {card:botCard,bonus:botBonusIdx!==null&&botBonusIdx!==undefined?BONUS[botBonusIdx]:null,add:0,mul:1,shield:false}
  ];

  const c0=side[0].bonus&&side[0].bonus.type==='cancel';
  const c1=side[1].bonus&&side[1].bonus.type==='cancel';
  if(c0&&!c1) side[1].bonus=null;
  if(c1&&!c0) side[0].bonus=null;

  let statIdx=initialStat;
  const sw0=!!(side[0].bonus&&side[0].bonus.type==='swap');
  const sw1=!!(side[1].bonus&&side[1].bonus.type==='swap');
  if(sw0!==sw1){
    const s=sw0?0:1;
    const vals=CARDS[side[s].card].st;
    statIdx=vals.indexOf(Math.max(...vals));
  }

  for(let s=0;s<2;s++){
    const b=side[s].bonus; if(!b||['cancel','swap'].includes(b.type)) continue;
    const o=1-s;
    if(b.type==='up') side[s].add+=b.val;
    else if(b.type==='down') side[o].add-=b.val;
    else if(b.type==='upStat'&&b.stat===statIdx) side[s].add+=b.val;
    else if(b.type==='downStat'&&b.stat===statIdx) side[o].add-=b.val;
    else if(b.type==='rage') side[s].mul=CFG.rageMult;
    else if(b.type==='shield') side[s].shield=true;
  }

  const myV=Math.max(0,Math.round(CARDS[myCard].st[statIdx]*side[0].mul)+side[0].add);
  const botV=Math.max(0,Math.round(CARDS[botCard].st[statIdx]*side[1].mul)+side[1].add);
  return {statIdx,myV,botV,myShield:side[0].shield,botShield:side[1].shield};
}

function simConsumePlayerBonus(i){
  if(i===null||i===undefined) return;
  const b=BONUS[i];
  S.bonus[i]=Math.max(0,(S.bonus[i]||0)-1);
  if(S.bonus[i]===0) delete S.bonus[i];
  S.stat.bonusUsed++; S.today.bonusUsed++; S.week.bonusUsed++;
  if(b&&(b.type==='down'||b.type==='downStat')){ S.stat.debuffUsed++; S.today.debuffUsed++; }
  if(b&&b.rar==='L'){ S.stat.legBonusUsed++; S.today.legBonusUsed++; }
}

function simTransferRound(myCard,botCard,cmp,res){
  if(res==='win'){
    S.stat.rounds++; S.stat.statWin[cmp.statIdx]++; S.today.rounds++; S.today.statWin[cmp.statIdx]++;
    if(!cmp.botShield){
      if(!S.opened[botCard]){
        // Новая PvP-карта не должна обходить текущий потолок.
        if(uniq()<cap()){
          S.opened[botCard]=true; S.copies[botCard]=1;
          S.stat.newCards++; S.stat.newCardsToday++; S.today.newCards++; S.week.newCards++;
          S.stat.cardsWon++;
        }
      }else{
        S.copies[botCard]=(S.copies[botCard]||0)+1;
        S.stat.dups++; S.stat.dupsPvP++;
        const v=CFG.starValue[CARDS[botCard].rar]; S.stars+=v; S.stat.starsEarned+=v;
        S.stat.cardsWon++;
      }
    }
  }else if(res==='lose'){
    S.stat.roundsLost++;
    if(!cmp.myShield){
      const before=S.copies[myCard]||0;
      if(before>1){ const v=CFG.starValue[CARDS[myCard].rar]; S.stars=Math.max(0,S.stars-v); }
      S.copies[myCard]=Math.max(0,before-1);
      S.stat.cardsLost++;
      return 1;
    }
  }else{
    S.stat.roundDraws++;
  }
  return 0;
}

function simFinishMatch(modeKey,myWins,botWins,lostCards,history,botMeta){
  const m=CFG.modes[modeKey];
  S.stat.matches++; S.matchesToday++; S.today.matches++; S.week.matches++;
  if(modeKey==='cls'){ S.stat.clsMatches++; S.today.clsMatches++; }

  const k=S.matchesToday<=5?1:(S.matchesToday<=8?0.5:0.25);
  let result,coins=0,rat=0;
  if(myWins>botWins){
    result='победа'; coins=Math.round(m.win*k); rat=Math.round(m.ratW*k);
    S.stat.wins++; S.week.wins++; S.today.wins++;
    S.stat.streak++; S.stat.bestStreak=Math.max(S.stat.bestStreak,S.stat.streak);
    S.today.streak++; S.today.bestStreak=Math.max(S.today.bestStreak,S.today.streak);
    if(modeKey==='pro'){ S.stat.proWins++; S.today.proWins++; }
    if(modeKey!=='exp'){ S.stat.bigWins++; S.week.bigWins++; }
    if(lostCards===0){ S.stat.cleanWin++; S.today.cleanWin++; }
    if(botWins===0){ S.stat.sweep++; S.today.sweep++; }
  }else if(myWins<botWins){
    result='поражение'; coins=Math.round(m.lose*k);
    S.stat.losses++; S.stat.streak=0; S.today.streak=0;
  }else{
    result='ничья'; coins=Math.round(m.draw*k); rat=Math.round(m.ratD*k);
    S.stat.draws++; S.stat.streak=0; S.today.streak=0;
  }

  addCoins(coins,'PvP'); S.rating+=rat;
  checkAchievements();
  LAST_MATCH={day:S.day,mode:m.name,result,my:myWins,op:botWins,coins,rat,lost:lostCards,history:history||[],botMeta:botMeta||null};
}

function autoMatch(){
  const av=availableModes().filter(k=>bkList().length>=CFG.modes[k].cards);
  const mode=av.includes('pro')?'pro':(av.includes('cls')?'cls':(av.includes('exp')?'exp':null));
  if(!mode) return;

  const m=CFG.modes[mode];
  const bk=bkList();
  const myHand=drawHand(bk.map(c=>c.id),m);
  const bot=buildBotOpponent(uniq(),bk.length,m.cards);
  const botBk=bot.bkIds;
  const botHand=drawHand(botBk,m);

  const drawN=modeBonusDraw(mode);
  const myTypes=randomBonusTypeSample(S.bonus||{},drawN);
  const botInv=makeBotBonusInventory(S.bonus||{});
  const botTypes=randomBonusTypeSample(botInv,drawN);
  const myUsed=[],botUsed=[];

  let myWins=0,botWins=0,lostCards=0;
  let namer=Math.random()<0.5?'me':'bot'; // жеребьёвка только первого выбирающего
  const history=[];

  for(let round=1; round<=m.cards && myHand.length && botHand.length; round++){
    let myCard,botCard,statIdx;

    if(namer==='me'){
      // Игрок называет характеристику: лучшая пара карта + характеристика.
      let best={v:-Infinity,id:null,s:null};
      myHand.forEach(id=>CARDS[id].st.forEach((v,s)=>{
        if(v>best.v) best={v,id,s};
      }));
      myCard=best.id;
      statIdx=best.s;

      // Бот отвечает на уже известную характеристику.
      botCard=botHand.reduce((a,b)=>CARDS[b].st[statIdx]>CARDS[a].st[statIdx]?b:a);
    }else{
      // Бот называет характеристику: лучшая пара карта + характеристика.
      let best={v:-Infinity,id:null,s:null};
      botHand.forEach(id=>CARDS[id].st.forEach((v,s)=>{
        if(v>best.v) best={v,id,s};
      }));
      botCard=best.id;
      statIdx=best.s;

      // Игрок отвечает на уже известную характеристику.
      myCard=myHand.reduce((a,b)=>CARDS[b].st[statIdx]>CARDS[a].st[statIdx]?b:a);
    }

    // Обе стороны знают названную характеристику, но не карту соперника.
    const myBonus=simBonusPick(myTypes,myUsed,statIdx,myCard);
    const botBonus=simBonusPick(botTypes,botUsed,statIdx,botCard);

    const cmp=simResolveRound(myCard,botCard,statIdx,myBonus,botBonus);
    const res=cmp.myV>cmp.botV?'win':(cmp.myV<cmp.botV?'lose':'draw');

    if(myBonus!==null){
      myUsed.push(myBonus);
      simConsumePlayerBonus(myBonus);
    }
    if(botBonus!==null) botUsed.push(botBonus);

    lostCards+=simTransferRound(myCard,botCard,cmp,res);
    if(res==='win') myWins++;
    else if(res==='lose') botWins++;

    history.push({
      n:round,myCard,botCard,statIdx:cmp.statIdx,myV:cmp.myV,botV:cmp.botV,res,
      myBonusName:myBonus!==null?BONUS[myBonus].name:null,
      botBonusName:botBonus!==null?BONUS[botBonus].name:null,
      myBonusIdx:myBonus,botBonusIdx:botBonus,lost:res==='lose',
      statChooser:namer
    });

    myHand.splice(myHand.indexOf(myCard),1);
    botHand.splice(botHand.indexOf(botCard),1);

    // Право выбора характеристики чередуется КАЖДЫЙ раунд.
    namer=namer==='me'?'bot':'me';
  }

  simFinishMatch(mode,myWins,botWins,lostCards,history,{
    playerUniq:uniq(),botUniq:bot.botUniq,
    playerBk:bk.length,botBk:bot.bkIds.length,
    playerD:bot.myD,botD:bot.botD,gapPct:bot.gapPct,
    playerRarity:bot.rarity?bot.rarity.player:null,
    botRarity:bot.rarity?bot.rarity.bot:null,
    playerBonusStock:Object.values(S.bonus||{}).reduce((a,n)=>a+(n||0),0),
    botBonusStock:Object.values(botInv||{}).reduce((a,n)=>a+(n||0),0),
    playerBonusDraw:myTypes.length,botBonusDraw:botTypes.length
  });
}

let MATCHES_PER_DAY=4;
// Тумблеры автопрогона: что именно делает «виртуальный игрок» каждый день.
// Выключенное не выполняется ни в одном варианте — так можно изолировать источник карт.
const AUTO={ tasks:true, qr:true, pvp:true, friends:true };
// Момент применения бонус-карты: 'blind' — выбирается вместе с картой, вслепую;
// 'open' — после вскрытия обеих карт, когда уже видно, кто выигрывает раунд.
let BONUS_TIMING='blind'; // финал: бонус выбирается вместе с основной картой, до вскрытия карты соперника
function setTiming(v){ BONUS_TIMING=v; render(); }
function toggleAuto(key){ AUTO[key]=!AUTO[key]; render(); }
function setMatches(v){ const n=parseInt(String(v).trim()); if(!isFinite(n)||n<0||n>20) return; MATCHES_PER_DAY=n; render(); }
// Режим работы демки:
//  'play'    — вы играете за активный вариант руками, остальные три проживают день сами,
//              чтобы сравнение оставалось честным;
//  'compare' — все четыре варианта проживают день автоматически (режим анализа).
let MODE='play';
function setMode(m){ MODE=m; render(); }
function nextDayAll(autoActive){
  const cur=ACTIVE;
  storeSlot(cur);
  const wasNoRender=NORENDER;
  NORENDER=true;
  SLOTS.forEach((sl,i)=>{
    useSlot(i);
    if(S.seasonOver) return;
    const isActive = (i===cur);
    // ГЛОБАЛЬНЫЕ настройки поведения одинаковы для всех четырёх вариантов.
    // Если пользователь выключил PvP / задания / QR / друзей, это выключается во всех 4 вариантах.
    CAPTURE = isActive && MODE==='play';
    nextDay();
    const doTasks  = AUTO.tasks;
    const doQR     = AUTO.qr;
    const doFriend = AUTO.friends;
    const matches  = AUTO.pvp ? MATCHES_PER_DAY : 0;
    if(doTasks){
      if(canDoDaily()) doDaily();
      if(!S.socialToday) doSocialDaily();
      CFG.weekly.forEach((w,k)=>{ const p=weeklyProgress(k); if(!S.weeklyDone[k]&&weekOf(S.day)>=k&&p.have>=p.need) doWeekly(k); });
    }
    if(doQR && S.qrUsed<CFG.qr.limit && S.qrToday<1){
      S.qrToday++; S.qrUsed++; S.today.qrUsed++; addBonus(CFG.qr.bonusPerCode);
    }
    if(doFriend && S.friends<30 && (S.today.friends||0)<1) inviteFriend();   // один друг в каждый прожитый день
    for(let m=0;m<matches;m++){ if(pvpGateOk() && bkList().length>=3) autoMatch(); }
    CAPTURE=false;
    storeSlot(i);
  });
  NORENDER=wasNoRender;
  useSlot(cur); M=null;
  render();
}

// Бот-соперник: коллекция в коридоре матчмейкинга, боевая колода того же размера,
// что и у игрока (реальный соперник тоже теряет экземпляры в матчах).
function buildBotOpponent(myUniq,myBkSize,handSize){
  const myBk=bkList();
  const locked=new Set(safeLocked());
  const available=CARDS.filter(c=>!locked.has(c.id));
  const byR={
    C:available.filter(c=>c.rar==='C'),
    R:available.filter(c=>c.rar==='R'),
    L:available.filter(c=>c.rar==='L')
  };

  const density=ids=>{
    if(!ids || !ids.length) return 0;
    let sum=0;
    ids.forEach(x=>{
      const c=typeof x==='number'?CARDS[x]:x;
      sum += c.rar==='L' ? 4 : (c.rar==='R' ? 2 : 1);
    });
    return sum/ids.length;
  };

  const myD=density(myBk);
  const targetBkSize=Math.max(3,Math.min(CFG.bkSize,myBkSize,available.length));

  // Перебираем ВСЕ возможные редкостные составы БК нужного размера.
  // D зависит только от C/R/L, поэтому это даёт математическую гарантию ±8%.
  const feasible=[];
  for(let l=0;l<=Math.min(targetBkSize,byR.L.length);l++){
    for(let r=0;r<=Math.min(targetBkSize-l,byR.R.length);r++){
      const c=targetBkSize-l-r;
      if(c<0 || c>byR.C.length) continue;
      const d=(c+2*r+4*l)/targetBkSize;
      const gapPct=myD>0?Math.abs(d-myD)/myD*100:0;
      if(gapPct<=8.000001) feasible.push({C:c,R:r,L:l,d,gapPct});
    }
  }

  // Такой состав всегда существует как минимум в виде текущего состава игрока,
  // потому что бот использует тот же доступный пул и тот же размер БК.
  let comp;
  if(feasible.length){
    // Не берём "самый близкий". Сначала задаём случайную целевую плотность внутри ±8%,
    // затем выбираем ближайший к НЕЙ допустимый дискретный состав.
    const targetD=myD*(0.92+Math.random()*0.16);
    const shuffled=shuffle(feasible.slice());
    comp=shuffled.reduce((best,x)=>
      !best || Math.abs(x.d-targetD)<Math.abs(best.d-targetD) ? x : best
    ,null);
  }else{
    // Страховка на случай повреждённого состояния: зеркалим фактический C/R/L игрока.
    const cnt={C:0,R:0,L:0};
    myBk.forEach(c=>cnt[c.rar]++);
    comp={...cnt,d:myD,gapPct:0};
  }

  const sample=(arr,n)=>shuffle(arr.slice()).slice(0,n).map(c=>c.id);
  const bkIds=[
    ...sample(byR.C,comp.C),
    ...sample(byR.R,comp.R),
    ...sample(byR.L,comp.L)
  ];

  const botD=density(bkIds);
  const gapPct=myD>0?Math.abs(botD-myD)/myD*100:0;

  // Дополнительный фильтр ГДД: ±15 уникальных карт коллекции.
  // Коллекция бота включает его БК плюс случайный остаток доступных карт.
  const minUniq=Math.max(targetBkSize,Math.max(5,myUniq-15));
  const maxUniq=Math.min(available.length,Math.max(minUniq,myUniq+15));
  const botUniq=minUniq+Math.floor(Math.random()*(maxUniq-minUniq+1));

  const used=new Set(bkIds);
  const filler=shuffle(available.filter(c=>!used.has(c.id)).map(c=>c.id))
    .slice(0,Math.max(0,botUniq-bkIds.length));
  const collectionIds=bkIds.concat(filler);

  return {
    collectionIds,
    bkIds,
    myD,
    botD,
    gapPct,
    botUniq:collectionIds.length,
    rarity:{player:{
      C:myBk.filter(c=>c.rar==='C').length,
      R:myBk.filter(c=>c.rar==='R').length,
      L:myBk.filter(c=>c.rar==='L').length
    },bot:{C:comp.C,R:comp.R,L:comp.L}}
  };
}

function profileModeBkMin(modeKey){

    .filter(([k])=>bk>=profileModeBkMin(k))
    .map(([k])=>k);
}
// Рука на матч: случайные N карт из боевой колоды с контролем редкостей.
// Legendary — не более 60% руки, Rare — не более 80%, если есть карты других редкостей.
// Если альтернатив физически не хватает, лимит автоматически ослабляется.
function drawHand(ids,m){
  const n=Math.min(m.cards,ids.length);
  const pool=shuffle([...ids]);

  const countPool=r=>pool.filter(id=>CARDS[id].rar===r).length;
  const lTotal=countPool('L'), rTotal=countPool('R');
  const nonL=pool.length-lTotal, nonR=pool.length-rTotal;

  const nominalL=Math.floor(n*0.60);
  const nominalR=Math.floor(n*0.80);

  // Минимум карт этой редкости, который неизбежен из-за нехватки альтернатив.
  const forcedL=Math.max(0,n-nonL);
  const forcedR=Math.max(0,n-nonR);

  const maxL=Math.max(nominalL,forcedL);
  const maxR=Math.max(nominalR,forcedR);

  const hand=[], deferred=[];
  let l=0,r=0;

  for(const id of pool){
    if(hand.length>=n) break;
    const rar=CARDS[id].rar;
    if(rar==='L' && l>=maxL){ deferred.push(id); continue; }
    if(rar==='R' && r>=maxR){ deferred.push(id); continue; }

    hand.push(id);
    if(rar==='L') l++;
    if(rar==='R') r++;
  }

  // Страховка: если из-за состава пула руку не удалось заполнить,
  // добираем отложенные карты независимо от лимита.
  for(const id of deferred){
    if(hand.length>=n) break;
    hand.push(id);
  }
  return hand;
}

function randomBonusTypeSample(inv, limit){
  const types=Object.entries(inv||{})
    .filter(([,n])=>n>0)
    .map(([i])=>+i);
  shuffle(types);
  return types.slice(0, Math.max(0,Math.min(limit,types.length)));
}
function modeBonusDraw(modeKey){
  return modeKey==='exp' ? TUNE.bonusDrawExpress
       : modeKey==='cls' ? TUNE.bonusDrawClassic
       : TUNE.bonusDrawPro;
}
// Соперник получает независимый бонус-пул того же ОБЪЁМА, что и реальный запас игрока,
// но состав генерируется заново по той же редкостной выдаче 70 / 25 / 5.
// Затем на матч случайно выбирается ограниченное число типов — так же, как у игрока.
function makeBotBonusInventory(playerInv){
  const rarityCount={C:0,R:0,L:0};

  Object.entries(playerInv||{}).forEach(([i,n])=>{
    const b=BONUS[+i];
    if(!b || !n) return;
    rarityCount[b.rar]=(rarityCount[b.rar]||0)+n;
  });

  const inv={};
  ['C','R','L'].forEach(rar=>{
    const pool=BONUS.map((b,i)=>({b,i})).filter(x=>x.b.rar===rar);
    for(let k=0;k<(rarityCount[rar]||0);k++){
      if(!pool.length) break;
      const pick=pool[Math.floor(Math.random()*pool.length)].i;
      inv[pick]=(inv[pick]||0)+1;
    }
  });

  return inv;
}
function startMatch(modeKey){
  const m=CFG.modes[modeKey];
  const bk=bkList();
  const bkMin=profileModeBkMin(modeKey);

  if(bkMin && bk.length<bkMin){
    log(`Для режима ${m.name} нужно минимум ${bkMin} карт на руках, доступных для игры`,'warn'); render(); return;
  }
  if(bk.length<m.cards){
    log(`Для режима ${m.name} нужно минимум ${m.cards} карт в боевой колоде`,'warn'); render(); return;
  }

  const myHand=drawHand(bk.map(c=>c.id),m);
  const bot=buildBotOpponent(uniq(),bk.length,m.cards);
  const botHand=drawHand(bot.bkIds,m);
  const first=Math.random()<0.5?'me':'bot';

  M={
    mode:modeKey,m,myHand,botHand,myWins:0,botWins:0,roundDraws:0,round:1,
    scheduledNamer:first,namer:first,phase:'',pendingStat:null,botCard:null,
    myBonus:null,botBonus:null,myCard:null,myStat:null,bonusDecision:'pending',boardReveal:null,
    myBonusTypes:[],usedBonusTypes:[],botUsedBonusTypes:[],lostCards:0,logs:[],
    botMeta:{
      playerUniq:uniq(),
      botUniq:bot.botUniq,
      playerBk:bk.length,
      botBk:bot.bkIds.length,
      playerD:bot.myD,
      botD:bot.botD,
      gapPct:bot.gapPct,
      playerRarity:bot.rarity?bot.rarity.player:null,
      botRarity:bot.rarity?bot.rarity.bot:null
    }
  };

  // Игрок: случайная выборка из фактического бонус-запаса.
  // Бот: отдельный пул такого же размера и той же редкостной структуры,
  // затем такая же случайная выборка 3 / 5 / 7 типов.
  const drawN=modeBonusDraw(modeKey);
  M.myBonusTypes=randomBonusTypeSample(S.bonus||{},drawN);

  M.botBonusInv=makeBotBonusInventory(S.bonus||{});
  M.botBonusTypes=randomBonusTypeSample(M.botBonusInv,drawN);
  M.botStock=M.botBonusTypes.length;

  M.botMeta.playerBonusStock=Object.values(S.bonus||{}).reduce((a,n)=>a+(n||0),0);
  M.botMeta.botBonusStock=Object.values(M.botBonusInv||{}).reduce((a,n)=>a+(n||0),0);
  M.botMeta.playerBonusDraw=M.myBonusTypes.length;
  M.botMeta.botBonusDraw=M.botBonusTypes.length;

  M.firstNamer=first;
  prepRound();
  render();
}
function setupTurn(){
  M.namer=M.scheduledNamer;

  if(M.namer==='bot'){
    // Соперник называет характеристику: выбирает сильнейшую пару «карта + характеристика».
    let best={v:-Infinity,id:null,s:null};
    M.botHand.forEach(id=>{
      CARDS[id].st.forEach((v,s)=>{
        if(v>best.v) best={v,id,s};
      });
    });
    M.botCard=best.id;
    M.pendingStat=best.s;
    M.phase='respond';
  }else{
    // Ход игрока: сначала выбираются карта и характеристика.
    M.botCard=null;
    M.pendingStat=null;
    M.phase='name';
  }

  startTurnTimer();
}
function advanceBoardReveal(){
  if(!M || M.phase!=='boardReveal') return;
  if(M.revealTimer){
    clearTimeout(M.revealTimer);
    M.revealTimer=null;
  }
  M.boardReveal=null;

  if(M.round>M.m.cards || !M.myHand.length || !M.botHand.length) finishMatch();
  else prepRound();

  render();
}
function prepRound(){
  M.myBonus=null; M.botBonus=null; M.myCard=null; M.myStat=null;
  M.bonusDecision='pending'; M.botCard=null; M.pendingStat=null; M.botBonusPicked=null;

  if(!M.botHand.length||!M.myHand.length){
    finishMatch();
    return;
  }

  setupTurn();
}
// В бою показывается по одной карточке каждого типа бонуса, который был у игрока на старте матча.
// Количество экземпляров ×N остаётся только в разделе «Бонус-карты» вне боя.
function bonusOwnedList(){
  // Вне матча показываем реальный запас с коэффициентами количества.
  if(!M){
    return Object.entries(S&&S.bonus?S.bonus:{})
      .filter(([,n])=>n>0)
      .map(([i,n])=>({i:+i,n,...BONUS[+i]}));
  }
  // В матче каждый тип показывается одной карточкой и после использования исчезает из выбора.
  const used=new Set(M.usedBonusTypes||[]);
  return (M.myBonusTypes||[])
    .filter(i=>!used.has(i))
    .map(i=>({i,n:1,...BONUS[i]}));
}
function turnBonusOwnedList(){ return bonusOwnedList(); }
function botBonusList(){
  const used=new Set((M&&M.botUsedBonusTypes)||[]);
  return (M&&M.botBonusTypes?M.botBonusTypes:[])
    .filter(i=>!used.has(i) && M.botBonusInv && (M.botBonusInv[i]||0)>0)
    .map(i=>({i,n:1,...BONUS[i]}));
}
function consumeBotBonus(i){
  if(i===null||i===undefined||!M.botBonusInv||!M.botBonusInv[i]) return;
  M.botBonusInv[i]--;
  if(M.botBonusInv[i]<=0) delete M.botBonusInv[i];
  M.botStock=Math.max(0,M.botStock-1);
}
function chooseBotTurnBonus(statIdx,cardId){
  const list=botBonusList()
    .map(b=>({...b,g:Math.round(bonusScore(b,statIdx,cardId))}))
    .filter(b=>b.g>0||['shield','cancel','swap'].includes(b.type));
  if(!list.length) return null;
  const cost={C:0,R:1,L:2};
  list.sort((a,b)=>
    (b.g*(b.rar==='L'?0.3:1)-a.g*(a.rar==='L'?0.3:1)) ||
    (cost[a.rar]-cost[b.rar])
  );
  return list[0].i;
}
// Оценка полезности бонус-карты. statIdx — сравниваемая характеристика, если она уже известна
// (мы отвечаем или карты вскрыты); при ходе «называю сам» характеристика ещё не выбрана,
// поэтому адресные карты считаются с шансом 1/4.
function bonusScore(b, statIdx, cardId){
  const card = (cardId!==null && cardId!==undefined) ? CARDS[cardId] : null;
  const v = (card && statIdx!==null && statIdx>=0) ? card.st[statIdx] : 150;
  if(b.type==='up'||b.type==='down') return b.val;
  if(b.type==='upStat'||b.type==='downStat'){
    if(statIdx===null||statIdx<0) return b.val/4;      // характеристика ещё не названа
    return b.stat===statIdx ? b.val : 0;
  }
  if(b.type==='rage') return Math.round(v*(CFG.rageMult-1));
  if(b.type==='swap') return card ? Math.max(...card.st)-v : 25;
  if(b.type==='shield') return 30;
  if(b.type==='cancel') return 12;
  return 0;
}
// Список запаса, отсортированный по полезности; первый — рекомендованный.
// Когда карты вскрыты (известны myV и botV), лучшая рекомендация — САМАЯ ДЕШЁВАЯ карта,
// которой хватает, чтобы перевернуть раунд: сильные приберегаются на потом.
// Когда ход играется вслепую, легендарные карты в рекомендацию не выносятся —
// сыграть их можно, но советовать жечь Ярость каждый раунд неправильно.
function bonusRanked(statIdx, cardId, myV, botV){
  const open = (myV!==undefined && botV!==undefined);
  const list=turnBonusOwnedList().map(b=>{
    const g=Math.round(bonusScore(b,statIdx,cardId));
    const decides = open ? (myV<=botV && myV+g>botV) : false;
    return {...b, g, decides};
  });
  const cost={C:0,R:1,L:2};
  if(open){
    // 1) переворачивающие раунд — от самой дешёвой, 2) остальные — по убыванию пользы
    list.sort((a,b)=>{
      if(a.decides!==b.decides) return b.decides-a.decides;
      if(a.decides) return (a.g-b.g) || (cost[a.rar]-cost[b.rar]);
      return (b.g-a.g);
    });
  } else {
    list.sort((a,b)=>{
      const ea=a.g*(a.rar==='L'?0.3:1), eb=b.g*(b.rar==='L'?0.3:1);
      return (eb-ea) || (cost[a.rar]-cost[b.rar]);
    });
  }
  return list;
}
// Индекс случайной бонус-карты по редкости 70 / 25 / 5 — так же, как она приходит игроку.
function rollBonusIndex(){
  const r=Math.random(); const rar=r<0.70?'C':(r<0.95?'R':'L');
  let pool=BONUS.map((b,i)=>({b,i})).filter(x=>x.b.rar===rar);
  if(!pool.length) pool=BONUS.map((b,i)=>({b,i}));
  return pool[Math.floor(Math.random()*pool.length)].i;
}
function chooseMyBonus(i){
  if(!M) return;
  if((M.usedBonusTypes||[]).includes(i)) return;
  // Бонус полностью опционален: выбранная карта просто прикрепляется к текущему ходу.
  // Повторный клик снимает выбор.
  M.myBonus = M.myBonus===i ? null : i;
  render();
}
function selectMove(cardId,statIdx){
  if(!M||!['name','respond'].includes(M.phase)) return;

  M.myCard=cardId;
  M.myStat=M.namer==='me' ? statIdx : M.pendingStat;
  M.myBonus=null;
  M.bonusDecision='optional';

  render();
}
function confirmMove(){
  if(!M||M.myCard===null||M.myCard===undefined) return;
  if(M.myStat===null||M.myStat===undefined||M.myStat<0) return;

  // Бонус не обязателен: если ничего не выбрано, раунд играется без бонуса.
  playRound(M.myCard,M.namer==='me'?M.myStat:-1);
}
// Игрок посмотрел на вскрытые карты и решил, применять ли бонус-карту
function resolveRound(bonusIdx){
  if(!M || M.phase!=='reveal') return;
  stopTurnTimer();
  M.myBonus = (bonusIdx===undefined || bonusIdx===null) ? null : bonusIdx;
  const r=M.reveal;
  M.resolving=true; M.phase = M.namer==='me' ? 'name' : 'respond';
  playRound(r.myCard, M.namer==='me' ? r.statIdx : -1);
  M.resolving=false; if(M) M.reveal=null;
}

/* ===== Таймер хода: 10 секунд, по истечении ход делается автоматически ===== */
let turnTimer=null, turnLeft=0;
function stopTurnTimer(){ if(turnTimer){ clearInterval(turnTimer); turnTimer=null; } }
function startTurnTimer(){
  stopTurnTimer();
  if(NORENDER || !M || M.phase==='over') return;
  turnLeft=CFG.turnSeconds;
  paintTimer();
  turnTimer=setInterval(()=>{
    turnLeft--;
    paintTimer();
    if(turnLeft<=0){ stopTurnTimer(); autoPlayTurn(); }
  },1000);
}
function paintTimer(){
  const el=document.getElementById('turnclock');
  if(!el) return;
  el.textContent=turnLeft;
  el.className='clock'+(turnLeft<=3?' hot':'');
  const bar=document.getElementById('turnbar');
  if(bar) bar.style.width=Math.max(0,(turnLeft/CFG.turnSeconds*100))+'%';
}
// Время вышло — играем разумный ход, чтобы матч не вис
function autoPlayTurn(){
  if(!M || M.phase==='over') return;

  if(M.phase==='reveal'){
    log('Время вышло — раунд разыгран без бонус-карты','warn');
    resolveRound(null);
    return;
  }

  if(M.namer==='me'){
    let best={v:-Infinity,id:null,s:null};
    M.myHand.forEach(id=>{
      CARDS[id].st.forEach((v,s)=>{
        if(v>best.v) best={v,id,s};
      });
    });
    log('Время вышло — автоматически выбраны карта и характеристика','warn');
    playRound(best.id,best.s);
  }else{
    const ps=M.pendingStat;
    const id=M.myHand.reduce((a,b)=>CARDS[b].st[ps]>CARDS[a].st[ps]?b:a);
    log('Время вышло — сыграна лучшая карта по названной характеристике','warn');
    playRound(id,-1);
  }
}
function playRound(cardId,stat){
  if(!M||M.phase==='over'||!M.myHand.length||!M.botHand.length){ if(M) finishMatch(); render(); return; }
  const m=M.m;
  let myCard=cardId, botCard, statIdx;

  if(M.namer==='me'){
    // Игрок назвал характеристику; бот видит её и выбирает сильнейшую карту по ней.
    statIdx=stat;
    M.pendingStat=statIdx;
    botCard=M.botHand.reduce((a,b)=>CARDS[b].st[statIdx]>CARDS[a].st[statIdx]?b:a);
    M.botCard=botCard;
  }else{
    // Соперник назвал характеристику заранее; игрок отвечает по уже известной характеристике.
    statIdx=M.pendingStat;
    botCard=M.botCard;
  }

  // Бонус соперника выбирается после того, как известны его карта и названная характеристика,
  // но до вскрытия карты игрока.
  if(!M.botBonusLocked && M.botStock>0 && Math.random()<CFG.botBonusRate){
    M.botBonusPicked=chooseBotTurnBonus(statIdx,botCard);
  }else{
    M.botBonusPicked=null;
  }

  // Режим «после вскрытия»: сначала показываем обе карты, и только потом игрок решает,
  // тратить ли бонус-карту. В фоновом прогоне пауза не нужна — там решает автоигрок.
  if(false && BONUS_TIMING==='open' && !M.resolving && !NORENDER){
    M.reveal={myCard,botCard,statIdx,
              myV:CARDS[myCard].st[statIdx], botV:CARDS[botCard].st[statIdx]};
    M.phase='reveal'; M.myBonus=null;
    render(); startTurnTimer(); return;
  }
  // применение бонус-карт: Отмена → Подмена → одновременно множители и ± → Щит.
  // ВАЖНО: итог не зависит от порядка обработки игроков.
  let myV=CARDS[myCard].st[statIdx], botV=CARDS[botCard].st[statIdx];
  if(M.myBonusLocked) M.myBonus=null;
  if(M.botBonusLocked) M.botBonusPicked=null;
  const myB2 = M.myBonus!==null?BONUS[M.myBonus]:null;
  const botB = M.botBonusPicked!==null?BONUS[M.botBonusPicked]:null;
  let myShield=false, botShield=false;
  const myCancelled = !!(botB&&botB.type==='cancel'&&(!myB2||myB2.type!=='cancel'));
  const botCancelled = !!(myB2&&myB2.type==='cancel'&&(!botB||botB.type!=='cancel'));
  const myEff = myCancelled ? null : myB2;
  const botEff = botCancelled ? null : botB;

  // Если обе стороны сыграли Подмену, они взаимно гасятся и остаётся исходная характеристика.
  const mySwap=!!(myEff&&myEff.type==='swap'), botSwap=!!(botEff&&botEff.type==='swap');
  if(mySwap!==botSwap){
    const cid=mySwap?myCard:botCard;
    statIdx=CARDS[cid].st.indexOf(Math.max(...CARDS[cid].st));
  }

  const baseMy=CARDS[myCard].st[statIdx], baseBot=CARDS[botCard].st[statIdx];
  let myMul=1, botMul=1, myAdd=0, botAdd=0;
  const collectEffect=(b,who)=>{
    if(!b||['cancel','swap'].includes(b.type)) return;
    if(b.type==='up'){ if(who==='me') myAdd+=b.val; else botAdd+=b.val; }
    else if(b.type==='down'){ if(who==='me') botAdd-=b.val; else myAdd-=b.val; }
    else if(b.type==='upStat'&&b.stat===statIdx){ if(who==='me') myAdd+=b.val; else botAdd+=b.val; }
    else if(b.type==='downStat'&&b.stat===statIdx){ if(who==='me') botAdd-=b.val; else myAdd-=b.val; }
    else if(b.type==='rage'){
      if(who==='me') myMul=CFG.rageMult;
      else botMul=CFG.rageMult;
    }
    else if(b.type==='shield'){ if(who==='me') myShield=true; else botShield=true; }
  };
  collectEffect(myEff,'me'); collectEffect(botEff,'bot');
  myV=Math.max(0,Math.round(baseMy*myMul)+myAdd);
  botV=Math.max(0,Math.round(baseBot*botMul)+botAdd);
  if(myB2){
    M.usedBonusTypes=M.usedBonusTypes||[];
    if(!M.usedBonusTypes.includes(M.myBonus)) M.usedBonusTypes.push(M.myBonus);
    S.bonus[M.myBonus]=Math.max(0,(S.bonus[M.myBonus]||0)-1);
    if(S.bonus[M.myBonus]===0) delete S.bonus[M.myBonus];
    S.stat.bonusUsed++; S.today.bonusUsed++; S.week.bonusUsed++;
    if(myB2 && (myB2.type==='down'||myB2.type==='downStat')){ S.stat.debuffUsed++; S.today.debuffUsed++; }
    if(myB2&&myB2.rar==='L'){ S.stat.legBonusUsed++; S.today.legBonusUsed++; } }
  if(botB){
    M.botUsedBonusTypes=M.botUsedBonusTypes||[];
    if(!M.botUsedBonusTypes.includes(M.botBonusPicked)) M.botUsedBonusTypes.push(M.botBonusPicked);
    consumeBotBonus(M.botBonusPicked);
  }
  // исход
  let res;
  if(myV>botV) res='win'; else if(botV>myV) res='lose'; else res='draw';
  const sname=CFG.statNames[statIdx];
  let txt=`Раунд ${M.round}: ${CARDS[myCard].name} (${sname} ${myV}) против ${CARDS[botCard].name} (${botV})`;
  if(res==='win'){
    M.myWins++; S.stat.rounds++; S.stat.statWin[statIdx]++; S.today.rounds++; S.today.statWin[statIdx]++;
    if(botShield){ txt+=' — победа, но Щит соперника сохранил карту'; }
    else if(!S.opened[botCard]){
      S.opened[botCard]=true; S.copies[botCard]=1; S.stat.newCards++; S.stat.newCardsToday++; S.today.newCards++; S.week.newCards++;
      if(uniq()>cap()) S.stat.overCap=(S.stat.overCap||0)+1;
      S.stat.cardsWon++; txt+=' — победа, карта соперника новая!';
    } else {
      S.copies[botCard]=(S.copies[botCard]||0)+1;
      S.stat.dups++; S.stat.dupsPvP++; const v=CFG.starValue[CARDS[botCard].rar]; S.stars+=v; S.stat.starsEarned+=v;
      S.stat.cardsWon++; txt+=' — победа, карта забрана';
    }
  } else if(res==='lose'){
    M.botWins++; S.stat.roundsLost++;
    if(myShield){ txt+=' — поражение, но Щит сохранил карту'; }
    else {
      const before=S.copies[myCard]||0;
      if(before>1){ const v=CFG.starValue[CARDS[myCard].rar]; S.stars=Math.max(0,S.stars-v); }
      S.copies[myCard]=Math.max(0,before-1); S.stat.cardsLost++; M.lostCards++; txt+=' — поражение, экземпляр потерян';
    }
  } else { M.roundDraws++; S.stat.roundDraws++; txt+=' — ничья, карты остались у владельцев'; }
  M.logs.unshift(txt);
  M.myHand=M.myHand.filter(x=>x!==myCard);
  M.botHand=M.botHand.filter(x=>x!==botCard);
  (M.history=M.history||[]).push({ n:M.round, myCard, botCard, statIdx, myV, botV,
      res: myV>botV?'win':(botV>myV?'lose':'draw'),
      myBonusName: myB2?myB2.name:null, botBonusName: botB?botB.name:null,
      myBonusIdx: myB2?M.myBonus:null, botBonusIdx: botB?M.botBonusPicked:null, lost: (myV<botV) });
  M.lastRound={ myCard, botCard, statIdx, myV, botV,
                res: myV>botV?'win':(botV>myV?'lose':'draw'),
                myBonusName: myB2?myB2.name:null, botBonusName: botB?botB.name:null,
                myBonusIdx: myB2?M.myBonus:null, botBonusIdx: botB?M.botBonusPicked:null };
  M.round++; M.scheduledNamer = M.scheduledNamer==='me'?'bot':'me';
  if(!NORENDER){
    stopTurnTimer();
    M.boardReveal={...M.lastRound,statChooser:M.namer};
    M.phase='boardReveal';
    render();
    M.revealTimer=setTimeout(advanceBoardReveal,20000);
    return;
  }
  if(M.round>M.m.cards||!M.myHand.length||!M.botHand.length) finishMatch();
  else prepRound();
  render();
}

function finishMatch(){
  stopTurnTimer(); 
  const m=M.m; S.stat.matches++; S.matchesToday++; S.today.matches++; S.week.matches++;
  if(M.mode==='cls'){ S.stat.clsMatches++; S.today.clsMatches++; }
  const k=S.matchesToday<=5?1:(S.matchesToday<=8?0.5:0.25);
  let res, coins=0, rat=0;
  if(M.myWins>M.botWins){
    res='победа'; coins=Math.round(m.win*k); rat=Math.round(m.ratW*k);
    S.stat.wins++; S.week.wins++; S.today.wins++; S.stat.streak++; S.stat.bestStreak=Math.max(S.stat.bestStreak,S.stat.streak); S.today.streak++; S.today.bestStreak=Math.max(S.today.bestStreak,S.today.streak);
    if(M.mode==='pro'){ S.stat.proWins++; S.today.proWins++; }
    if(M.mode!=='exp'){ S.stat.bigWins++; S.week.bigWins++; }
    if(M.lostCards===0){ S.stat.cleanWin++; S.today.cleanWin++; }
    if(M.botWins===0){ S.stat.sweep++; S.today.sweep++; }
  } else if(M.myWins<M.botWins){
    res='поражение'; coins=Math.round(m.lose*k); S.stat.losses++; S.stat.streak=0; S.today.streak=0;
  } else {
    res='ничья'; coins=Math.round(m.draw*k); rat=Math.round(m.ratD*k); S.stat.draws++; S.stat.streak=0; S.today.streak=0;
  }
  addCoins(coins,'PvP'); S.rating+=rat;
  log(`${m.name}: ${res} ${M.myWins}:${M.botWins} — +${coins} монет${rat?`, +${rat} рейтинга`:''}${k<1?` (награда ${Math.round(k*100)}%)`:''}`, res==='победа'?'good':(res==='ничья'?'':'warn'));
  checkAchievements();
  M.phase='over'; M.result=res; M.coinsGot=coins; M.ratGot=rat;
  LAST_MATCH={ day:S.day, mode:M.m.name, result:res, my:M.myWins, op:M.botWins,
               coins:coins, rat:rat, lost:M.lostCards, history:(M.history||[]).slice() };
}

function renderHomeColl(){

  if(S.day===0){ el.innerHTML=''; return; }
  const lockedSet=new Set(safeLocked()), safeCount=lockedSet.size;

  let s=`<div class="striphead"><h3>Коллекция</h3>

  s+=`<div class="qbox userprogress"><div class="qhead">В сейфе: <b>${safeCount}</b></div></div>`;

  s+='<div class="dgrid">';
  [...Array(12).keys()].forEach(d=>{
    const ids=deckCards(d), have=ids.filter(i=>S.opened[i]).length;
    const safeInDeck=ids.filter(i=>lockedSet.has(i)).length;
    s+=`<div class="dtile${have===10?' full':''}">
      <i>${CFG.emoji[d]}</i><b>${CFG.animals[d]}</b>
      <span>${have}/10${safeInDeck?` · 🔒${safeInDeck}`:''}</span>

  s+='</div>';

  const order=playerOrder();

    <div class="homeorderrow">`;
  order.forEach((d,pos)=>{

    const done=have===10;
    const current=!done && !order.slice(0,pos).some(pd=>deckCards(pd).some(i=>!S.opened[i]));
    s+=`<div class="homeorderitem ${done?'done':''} ${current?'current':''}">
      <span>${pos+1}</span><i>${CFG.emoji[d]}</i><b>${CFG.animals[d]}</b><em>${have}/10</em>

  });

      <span>${OPEN.collFull?'вернуться к сводке':`${uniq()} открыто, ${120-uniq()} осталось`}</span></button>`;

  if(OPEN.collFull){
    s+='<div class="fullcoll">';
    [...Array(12).keys()].forEach((d,k)=>{
      const ids=deckCards(d), have=ids.filter(i=>S.opened[i]).length;
      s+=`<div class="fdeck${have===10?' full':''}"><div class="fdh"><span class="fnum">${k+1}</span>
        <i>${CFG.emoji[d]}</i><b>${CFG.animals[d]}</b>
        <span class="ftag">${have}/10${have===10?' · собрана':''}</span></div><div class="frow">`;

          s+=`<div class="fc safe"><i>🔒</i><b>—</b><s>${c.name.split(': ')[1]}</s></div>`;

          const cls=S.opened[i]?`have ${c.rar}`:'miss';
          const cnt=S.copies[i]>1?`<u>×${S.copies[i]}</u>`:'';

// ── Карточка животного: используется в бою и в колоде ──
function cardHTML(id, opts){
  opts=opts||{};
  const c=CARDS[id];
  const rn={C:'обычная',R:'редкая',L:'легендарная'}[c.rar];
  const top=c.st.indexOf(Math.max(...c.st));
  let h=`<div class="card3d ${c.rar}${opts.pick?' pick':''}" ${opts.onclick?`onclick="${opts.onclick}"`:''}>`;
  if(opts.badge) h+=`<span class="c3-badge">${opts.badge}</span>`;
  h+=`<div class="c3-top">
        <div class="c3-face">${CFG.emoji[c.deck]}</div>
        <div class="c3-ttl"><div class="c3-name">${c.name}</div><div class="c3-rar ${c.rar}">${rn}</div></div>
      </div><div class="c3-stats">`;
  c.st.forEach((v,si)=>{
    const cls = (opts.hot===si) ? 'hot' : (si===top ? 'top' : '');
    if(opts.statClick!==undefined && opts.statClick!==null)
      h+=`<button class="c3-st ${cls}" onclick="event.stopPropagation();${opts.statClick}(${id},${si})">${CFG.statShort[si]}<b>${v}</b></button>`;
    else
      h+=`<div class="c3-st ${cls}">${CFG.statShort[si]}<b>${v}</b></div>`;
  });
  h+='</div></div>';
  return h;
}
