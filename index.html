<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BabyFox Лесная лига — сравнение профилей выдачи</title>
<style>
:root{
  --bg:#12100e; --panel:#1c1916; --panel2:#241f1a; --line:#3a3129;
  --ink:#f0e9e0; --muted:#a2968a; --acc:#e8892b; --acc2:#7ab648;
  --c:#8fa5b8; --r:#a988d6; --l:#e8b23a;
}
*{box-sizing:border-box}
#tunepanel{position:sticky;top:64px;z-index:15;background:var(--panel);border-bottom:2px solid var(--acc);padding:14px 16px;max-height:70vh;overflow:auto}
#tunepanel h3{margin:0 0 4px}
.tunegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px 22px}
.tsec{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.tsec b{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.trow{display:grid;grid-template-columns:1fr 120px 52px;align-items:center;gap:8px;margin-top:6px;font-size:12px}
.trow input[type=range]{width:100%}
.trow .tval{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
#profiletabs{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
#ptabs{margin-top:8px}
.ptrow2{margin-top:6px}
.ptab.sub{background:transparent;border-style:dashed}
.ptab.sub.on{background:rgba(232,137,43,.10);border-style:solid}
.ptab.sub b{color:var(--acc2)}
.ptrow{display:flex;gap:6px;flex-wrap:wrap}
.ptab{flex:1;min-width:190px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer;color:var(--ink);line-height:1.3}
.ptab.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.ptab b{display:block;font-size:11.5px;color:var(--acc);font-weight:600}
.ptab .m{font-size:11px;color:var(--muted);margin-top:1px;display:block}
.pdesc{font-size:12px;color:var(--muted);line-height:1.5}
.pdesc b{color:var(--ink)}
.autorow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tgl{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px}
.tgl.on{border-color:var(--acc2);color:var(--ink);background:rgba(122,182,72,.12)}
.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.cmp td,.cmp th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp tr.on td{color:var(--acc)}
.tnum{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;text-align:right}
.tnum:focus{outline:2px solid var(--acc);outline-offset:0}
input.tval{width:52px}
.tunebtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.twarn{color:var(--l);font-size:12px;margin-top:6px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1c1916,#1c1916f0);border-bottom:1px solid var(--line);padding:10px 16px}
h1{font-size:16px;margin:0 0 8px;letter-spacing:.02em}
h1 span{color:var(--acc)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px}
.hudrow{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.pill b{color:var(--ink)}
.pill.coin b{color:var(--acc)} .pill.star b{color:var(--l)}
.wrap{display:grid;grid-template-columns:1fr 1fr 340px;gap:14px;padding:14px;align-items:start}
@media(max-width:1200px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
button{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc);color:#fff}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#1a1206;font-weight:600}
.topbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.tag{font-weight:400;color:var(--muted);font-size:11px;text-transform:none;letter-spacing:0}
.task{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.task.ready{border-color:var(--acc2)}
.task.done{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:8px}
button.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:180px;text-align:left;padding:8px 12px}
button.mode b{font-size:14px}
button.mode span{font-size:12px;color:var(--muted)}
.deck{margin-bottom:10px}
.dh{margin-bottom:4px}
.deck.full .dh b{color:var(--acc2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.chip{position:relative;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:5px 7px;font-size:11px}
.chip.R{border-left-color:var(--r)} .chip.L{border-left-color:var(--l)}
.chip.ghost{opacity:.25}
.chip b{display:block;font-size:11px;font-weight:600}
.chip .st{color:var(--muted);font-size:10px}
.chip .cnt{position:absolute;top:4px;right:24px;color:var(--acc);font-style:normal;font-size:11px}
.lock{position:absolute;top:2px;right:2px;padding:1px 4px;font-size:11px;background:none;border:none}
.lock.on{color:var(--acc)}
.bkpick{position:absolute;top:2px;right:22px;padding:1px 4px;font-size:10px;background:none;border:none;color:var(--muted)}
.bkpick.on{color:var(--acc2)}
.mhead{font-size:15px;margin-bottom:8px}
.turn{background:var(--panel2);border:1px solid var(--acc);border-radius:7px;padding:7px 10px;margin-bottom:8px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:8px}
.hcard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:8px}
.hcard.R{border-left-color:var(--r)} .hcard.L{border-left-color:var(--l)}
.hcard .stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.stat{font-size:11px;padding:4px 6px;text-align:left}
.stat.hl{border-color:var(--acc);color:var(--acc)}
.stat.flat{border:1px dashed var(--line);color:var(--muted);border-radius:7px;padding:4px 6px;font-size:11px}
.answer{width:100%;margin-top:6px;border-color:var(--acc);color:var(--acc)}
.bonusbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:8px}
.bchip{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--c)}
.bchip.R{color:var(--r)} .bchip.L{color:var(--l)}
.bchip.sel{border-color:var(--acc);background:#3a2a14;color:#fff}
.bchip i{font-style:normal;color:var(--muted)}
.bonuslist{display:flex;flex-wrap:wrap;gap:5px}
.mlog{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.mres{padding:8px 10px;border-radius:7px;background:var(--panel2);margin-bottom:8px}
.mres.good{border:1px solid var(--acc2)} .mres.bad{border:1px solid #b4553a}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:3px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right}
.le{font-size:12px;padding:3px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.le span{color:#6d6058;margin-right:6px}
.le.good{color:var(--acc2)} .le.warn{color:#d99}

/* ===== Панель запаса бонус-карт ===== */
.blist{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto;margin-top:6px}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 8px;border-radius:8px;background:var(--panel2);border-left:3px solid var(--line)}
.brow.C{border-left-color:var(--c)} .brow.R{border-left-color:var(--r)} .brow.L{border-left-color:var(--l)}
.brow .bn{font-weight:600;font-size:12.5px}
.brow .bq{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;align-self:start}
.brow .bd{grid-column:1/-1;font-size:11.5px;color:var(--muted);line-height:1.35}

/* ===== Игровой экран ===== */
.arena-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.score{font-size:26px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.score .me{color:var(--acc2)} .score .op{color:#d9705a} .score .sep{color:var(--muted);margin:0 4px}
.minfo{flex:1;min-width:160px;font-size:13px}
.timer{display:flex;align-items:baseline;gap:5px}
.clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.hot{color:#e8544a}
.tbarwrap{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}
.tbar{height:100%;width:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .95s linear}

.side{margin:8px 0 4px}
.sidelbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.backs{display:flex;gap:5px;flex-wrap:wrap}
.back{width:32px;height:46px;border-radius:6px;border:1px solid #4a3d31;
  background:repeating-linear-gradient(135deg,#2b2018 0 5px,#332619 5px 10px)}

.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:8px 0}
.acard{border-radius:10px;padding:8px 10px;background:var(--panel);border-left:3px solid var(--line)}
.acard.C{border-left-color:var(--c)} .acard.R{border-left-color:var(--r)} .acard.L{border-left-color:var(--l)}
.acard .an{font-size:11.5px;color:var(--muted)}
.acard .av{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.acard .ab{font-size:11px;color:var(--acc)}
.amid{text-align:center;min-width:104px}
.amid .astat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.rwin{color:var(--acc2);font-weight:600;font-size:12.5px}
.rlose{color:#e8544a;font-weight:600;font-size:12.5px}
.rdraw{color:var(--muted);font-weight:600;font-size:12.5px}

.turn{padding:8px 10px;border-radius:9px;font-size:13px;margin:6px 0}
.turn.mine{background:rgba(122,182,72,.12);border:1px solid var(--acc2)}
.turn.theirs{background:rgba(232,137,43,.10);border:1px solid var(--acc)}

.hcard .hname{font-size:12px;font-weight:600;margin-bottom:5px;line-height:1.25}
.hcard .stats{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.stat{display:flex;justify-content:space-between;gap:6px;padding:4px 6px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11px;cursor:pointer}
.stat b{font-variant-numeric:tabular-nums}
.stat:hover{border-color:var(--acc)}
.stat.flat{cursor:default}
.stat.best{border-color:#5c4a36}
.stat.hot{border-color:var(--acc);background:rgba(232,137,43,.14);font-weight:600}
.answer{width:100%;margin-top:6px;background:var(--acc2);color:#10240a;border:0;border-radius:7px;padding:5px;font-weight:600;cursor:pointer}
.bchip em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:2px;max-width:190px;white-space:normal}
.bchip{text-align:left;line-height:1.3}


.rdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.rdot.C{background:var(--c)} .rdot.R{background:var(--r)} .rdot.L{background:var(--l);box-shadow:0 0 6px var(--l)}
.rlbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px}
.rlbl.L{color:var(--l)} .rlbl.R{color:var(--r)}
.hcard.L{box-shadow:inset 0 0 0 1px rgba(232,178,58,.35)}
.hist{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px 10px;margin:10px 0}
.histh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.hrow{display:grid;grid-template-columns:22px 74px 1fr 84px 1fr 150px;gap:8px;align-items:center;
  padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.hrow:first-of-type{border-top:0}
.hrow .hn{color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .hs{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hrow .hc b{font-variant-numeric:tabular-nums;margin-left:4px}
.hrow .hc em{font-style:normal;color:var(--acc);font-size:11px}
.hrow .hl{font-size:11px;color:var(--muted);text-align:right}
@media(max-width:900px){.hrow{grid-template-columns:20px 1fr 1fr;grid-auto-flow:row}.hrow .hl,.hrow .hs{grid-column:1/-1}}

</style>
</head>
<body>
<header>
  <h1>BabyFox <span>Лесная лига</span> — сравнение профилей выдачи</h1>
  <div id="hud"></div>
  <div class="topbtns">
    <button class="primary" id="btnNext" onclick="nextDayAll()">Прожить день (все профили)</button>
    <button onclick="nextDaysAll(7)">+ неделя</button>
    <button onclick="nextDaysAll(30)">+ 30 дней</button>
    <button onclick="save()">Сохранить</button>
    <button onclick="load()">Загрузить</button>
    <button onclick="exportJSON()">Экспорт JSON</button>
    <button onclick="resetAll()">Сброс всех</button>
    <button class="primary" onclick="toggleTune()">⚙ Параметры выдачи</button>
  </div>
  <div id="ptabs"></div>
</header>
<div id="tunepanel" style="display:none"></div>
<div id="profiletabs"></div>
<div class="wrap">
  <div>
    <div class="panel" id="tasks"></div>
    <div class="panel" id="pvp" style="margin-top:14px"></div>
    <div class="panel" id="match" style="margin-top:14px;display:none"></div>
  </div>
  <div class="panel" id="collection"></div>
  <div>
    <div class="panel" id="shop"></div>
    <div class="panel" id="bonuses" style="margin-top:14px"></div>
    <div class="panel" id="stats" style="margin-top:14px"></div>
    <div class="panel" id="log" style="margin-top:14px"></div>
    <div class="panel" id="rules" style="margin-top:14px"></div>
  </div>
</div>
<script>
/* ================= ГСЧ С СИДОМ =================
   Все варианты проживают один и тот же день с одинакового старта, поэтому
   различия в коллекциях идут только от правил выдачи, а не от везения.      */
let _rng=123456789;
function setSeed(x){ _rng=(x>>>0)||1; }
Math.random=function(){ _rng=(_rng*1664525+1013904223)>>>0; return _rng/4294967296; };

/* ================= НАСТРАИВАЕМЫЕ ПАРАМЕТРЫ (ползунки) ================= */
// Всё, что можно двигать в песочнице. Значения по умолчанию = текущий баланс.
const TUNE = {
  // ── ЛЕСТНИЦА КОЛОД (настраивается) ──
  // Когда выдаётся новая карта «в колоду», игра смотрит на очередь колод (фиксированную,
  // одну для всех) и по этим ступеням решает, В КАКУЮ из ещё не собранных колод пойдёт карта.
  // Каждая ступень — доля попаданий в группу колод. Внутри группы колоды делят долю поровну.
  // Пример по умолчанию: 1-я колода очереди — 55%, следующие ДВЕ — суммарно 35% (по 17,5%),
  // все остальные — суммарно 10%. Суммы долей = 1.
  ladderSteps: [
    { count: 1, share: 0.55 },   // самая приоритетная колода
    { count: 2, share: 0.35 },   // следующая пара колод (делят поровну)
    { count: 99, share: 0.10 },  // все оставшиеся открытые колоды (делят поровну)
  ],
  // (подобрано прогоном: с N=3 даёт быстрый старт первой колоды и неочевидный порядок дальше)
  // ── Зафиксировано (не трогаем — это финал баланса) ──
  noveltyStart: 0.85, novelty30: 0.65, novelty60: 0.45, novelty85: 0.30,
  // ── ШАГ СЛУЧАЙНОЙ ВЫДАЧИ ──
  // Каждая N-я новая карта выдаётся ПОЛНОСТЬЮ СЛУЧАЙНО среди всех доступных карт
  // коллекции (кроме заблокированных сейфом), в обход лестницы. 0 — выключено.
  randomEveryN: 3,
  decay: 0,            // убыль веса по заполнению колоды (0 — выкл)
  fillEveryN: 0,       // каждая N-я карта в самую незаполненную колоду (0 — выкл)
  fillMinGap: 0,       // требуемое отставание от средней заполненности, в картах
  finishLe2: 1.0, finishLe4: 1.0,        // добивание почти собранных колод выключено (=1)
  dupC: 0.70, dupR: 0.20, dupL: 0.10,
  achDeck: 125,
  bonusDrawExpress: 3, bonusDrawClassic: 5, bonusDrawPro: 7,
};

/* ================= КОНФИГ БАЛАНСА ================= */
const CFG = {
  seasonDays: 60,
  animals: ['Ёж','Белка','Заяц','Ласка','Барсук','Бобр','Рысь','Сова','Олень','Волк','Медведь','Лис'],
  // ФИКСИРОВАННЫЙ порядок колод — один для всех игроков. Совпадает с порядком
  // отображения животных в коллекции, поэтому лестница визуально «идёт по порядку»,
  // но сам порядок перетасован, так что закрываются колоды не Ёж→Белка→…, а вразброс.
  deckOrderFixed: [2,6,4,0,3,1,10,11,7,8,9,5],   // Заяц,Рысь,Барсук,Ёж,Ласка,Белка,Медведь,Лис,Сова,Олень,Волк,Бобр
  legPerDeck: [2,1,2,1,2,2,1,2,2,2,2,1],
  rarePerDeck: 3,
  cardsPerDeck: 10,
  statNames: ['Сила','Ловкость','Интеллект','Смелость'],
  sigStat: [3,1,1,1,0,2,1,2,0,3,0,2],
  shape: { C:[0.40,0.28,0.18,0.14], R:[0.36,0.27,0.20,0.17], L:[0.30,0.26,0.23,0.21] },
  sums:  { C:400, R:650, L:950, L1:1100 },
  waveCaps: [24,40,54,67,79,90,100,108,115,120],
  waveDays: [1,2,4,7,11,16,22,29,37,46],
  // novelty/ladder/safe теперь вычисляются из TUNE (см. функции ниже)
  dailyPackTimeout: 14,               // пачка сменяется по 10 выполненным ИЛИ по 14 предложенным

  starValue: { C:1, R:2, L:3 },
  loginCoins: {1:5,2:5,4:10,6:15},
  loginBonus: {3:1,5:1,7:3},
  loginPackDays: [4,7],
  dailyTaskCoins: [10,11,12,13,14,15],
  dailyTaskPackChance: [0.08,0.09,0.11,0.12,0.14,0.16],
  dailyPackNames: ['Знакомство','Первые шаги','Освоение','Тактика','Мастерство','Финал'],
  dailyPackSize: 10,
  weekly: [
    {t:'Открыть 15 новых карт коллекции', lvl:'Простое', coins:50, bonus:2, pack:true,  need:{newCards:15}},
    {t:'Сыграть 10 матчей за неделю', lvl:'Простое', coins:50, bonus:2, pack:false, need:{matches:10}},
    {t:'Применить 10 бонус-карт', lvl:'Простое', coins:50, bonus:2, pack:true,  need:{bonusUsed:10}},

/* ================= ГЕНЕРАЦИЯ КАРТ ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const CARDS=[];
(function(){
  const rnd=mulberry(20260818);
  const roleC=['Следопыт','Дозорный','Собиратель','Бегун','Ученик','Сторож'];
  const roleR=['Вожак','Хранитель тропы','Мастер маскировки'];
  const roleL=['Дух леса','Владыка чащи'];
  CFG.animals.forEach((a,d)=>{
    const L=CFG.legPerDeck[d], nC=CFG.cardsPerDeck-CFG.rarePerDeck-L;
    const leads=[]; const sig=CFG.sigStat[d];
    for(let i=0;i<2;i++) leads.push(sig);
    [0,1,2,3].filter(x=>x!==sig).forEach(x=>{leads.push(x);leads.push(x);});
    for(let i=leads.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[leads[i],leads[j]]=[leads[j],leads[i]];}
    let li=0;
    const mk=(rar,sum,lead)=>{
      const sh=CFG.shape[rar]; const order=[0,1,2,3].filter(x=>x!==lead);
      for(let i=order.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      const full=[lead,...order]; const st=[0,0,0,0];
      full.forEach((s,p)=>{ st[s]=Math.round(sum*sh[p]*(0.94+rnd()*0.12)); });
      return st;
    };
    for(let k=0;k<nC;k++) CARDS.push({deck:d,animal:a,name:`${a}: ${roleC[k]}`,rar:'C',st:mk('C',CFG.sums.C,leads[li++%leads.length])});
    for(let k=0;k<CFG.rarePerDeck;k++) CARDS.push({deck:d,animal:a,name:`${a}: ${roleR[k]}`,rar:'R',st:mk('R',CFG.sums.R,leads[li++%leads.length])});
    for(let k=0;k<L;k++) CARDS.push({deck:d,animal:a,name:`${a}: ${roleL[k]}`,rar:'L',st:mk('L',L===1?CFG.sums.L1:CFG.sums.L,sig)});
  });
  CARDS.forEach((c,i)=>c.id=i);
  // Разнообразие комбинаций: внутри колоды не должно быть больше двух карт
  // с одинаковой парой «две сильнейшие характеристики». Ведущая характеристика
  // (тематика животного) сохраняется, меняются местами только 2-я и 3-я — суммы не меняются.
  for(let d=0;d<12;d++){
    const deck=CARDS.filter(c=>c.deck===d);
    const seen={};
    deck.forEach(c=>{
      const ord=[0,1,2,3].sort((a,b)=>c.st[b]-c.st[a]);
      let key=[ord[0],ord[1]].sort().join('-');
      if((seen[key]||0)>=2){
        const t=c.st[ord[1]]; c.st[ord[1]]=c.st[ord[2]]; c.st[ord[2]]=t;   // меняем 2-ю и 3-ю
        const ord2=[0,1,2,3].sort((a,b)=>c.st[b]-c.st[a]);
        key=[ord2[0],ord2[1]].sort().join('-');
      }
      seen[key]=(seen[key]||0)+1;
    });
  }
})();
const deckCards=d=>CARDS.filter(c=>c.deck===d).map(c=>c.id);

/* ===== Производные от TUNE ===== */
function noveltyChanceBy(frac){
  if(frac<0.30) return TUNE.noveltyStart;
  if(frac<0.60) return TUNE.novelty30;
  if(frac<0.85) return TUNE.novelty60;
  return TUNE.novelty85;
}
// Вес выбора для колоды на позиции rank в очереди открытых колод — по ступеням лестницы.
// Вес выбора для колоды на позиции rank в очереди из nOpen открытых колод.
// Последняя ступень («все остальные») делит свою долю на реальное число колод,
// попавших в неё, а не на служебный count — иначе дальним колодам достаются крохи.
function ladderRankWeight(rank, nOpen){
  const steps=TUNE.ladderSteps;
  let acc=0;
  for(let i=0;i<steps.length-1;i++){
    const st=steps[i];
    if(rank < acc + st.count) return st.share / st.count;
    acc += st.count;
  }
  // последняя ступень покрывает все позиции с acc и дальше
  const last=steps[steps.length-1];
  const remaining=Math.max(1, (nOpen!==undefined?nOpen:acc+1) - acc);
  return last.share / remaining;
}
// Сейф снимается по 1 карте за волну: 10 → 9 → … → 0
function safePerWave(){ const out=[]; for(let w=0;w<10;w++) out.push(Math.round(10*(9-w)/9)); return out; }

/* ===== СЕЙФ: одинаковый для всех игроков список карт, выведенных из оборота =====
   16 карт на первой волне (9 обычных / 5 редких / 2 легендарных), снимаются по волнам.
   Последние 2 карты открываются только на 52-й день — это и держит хвост сезона.      */
// СЕЙФ фиксирован для всех (постоянный сид). Ровно 10 карт: по 1 в каждой колоде,
// КРОМЕ первых двух колод очереди (их игрок должен закрывать сразу).
// Разбивка по редкости: 1 легендарная (из колоды, где легендарок 2 — усиленную не трогаем),
// 3 редких, 6 обычных. Конкретные карты выбираются случайно один раз и одинаковы для всех.
let SAFE_ORDER=[];
function buildSafe(){
  const rnd=mulberry(20260821);
  const safeDecks=CFG.deckOrderFixed.slice(2);       // 10 колод, кроме первых двух в очереди
  // назначаем каждой колоде редкость слота: 1×L, 3×R, 6×C
  const legCapable=safeDecks.filter(d=>CFG.legPerDeck[d]===2); // где 2 легендарки
  // выбираем колоду-донора легендарки
  const legDeck=legCapable[Math.floor(rnd()*legCapable.length)];
  const rest=safeDecks.filter(d=>d!==legDeck);
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  const rareDecks=rest.slice(0,3), commDecks=rest.slice(3); // 3 редких + 6 обычных
  const pickFrom=(deck,rar)=>{
    let ids=CARDS.filter(c=>c.deck===deck && c.rar===rar).map(c=>c.id);
    // для легендарки: не берём усиленную (у усиленной сумма выше — исключаем максимум)
    if(rar==='L' && ids.length>1){
      const maxSum=Math.max(...ids.map(id=>CARDS[id].st.reduce((a,b)=>a+b,0)));
      ids=ids.filter(id=>CARDS[id].st.reduce((a,b)=>a+b,0)!==maxSum);
    }
    return ids[Math.floor(rnd()*ids.length)];
  };
  const list=[ pickFrom(legDeck,'L'),
               ...rareDecks.map(d=>pickFrom(d,'R')),
               ...commDecks.map(d=>pickFrom(d,'C')) ];
  // порядок снятия: перемешиваем, но фиксированно
  for(let i=list.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[list[i],list[j]]=[list[j],list[i]];}
  SAFE_ORDER=list;
}
buildSafe();

};

  2:'Каждая 3-я карта компенсирует самую пустую колоду'

  2:'Колоды заполняются — пустые колоды заполняются автоматически: каждая 3-я карта заполняет самые пустые колоды'

function variantTune(v){
  const nov = v.nov==='A'?NOVELTY_A:NOVELTY_B;
  return Object.assign({}, {
    ladderSteps: JSON.parse(JSON.stringify(LADDER_COMMON)),
    decay: 0.75,
    randomEveryN: v.prof===1 ? 3 : 0,     // профиль 1: случайная раскладка
    fillEveryN:   v.prof===2 ? 3 : 0,     // профиль 2: заполнение самой пустой
    fillMinGap: 0,
    finishLe2:1.0, finishLe4:1.0,
    dupC:0.70, dupR:0.20, dupL:0.10, achDeck:125,
    bonusDrawExpress:3, bonusDrawClassic:5, bonusDrawPro:7,
  }, nov);
}
let ACTIVE=0;
let SLOTS=VARIANTS.map(v=>({v, tune:variantTune(v), S:null}));
let S=newState();

/* ================= ХЕЛПЕРЫ ================= */
const uniq=()=>S.opened.filter(Boolean).length;
const cap=()=>CFG.waveCaps[S.wave];
const deckClosed=d=>deckCards(d).every(i=>S.opened[i]);
const closedDecks=()=>{let n=0;for(let d=0;d<12;d++) if(deckClosed(d)) n++; return n;};
// Боевая колода: если карт на руках 50 или меньше — входят все.
// Если больше — игрок сам отмечает, какие 50 взять (S.bkPicked).
const ownedCards=()=>CARDS.filter(c=>S.copies[c.id]>0 && !S.blocked.includes(c.id));
const bkList=()=>{
  const own=ownedCards();
  if(own.length<=CFG.bkSize) return own;
  const picked=own.filter(c=>S.bkPicked.includes(c.id));
  if(picked.length>=CFG.bkSize) return picked.slice(0,CFG.bkSize);
  // добираем до 50 по порядку коллекции, чтобы колода не оказалась пустой
  const rest=own.filter(c=>!S.bkPicked.includes(c.id));
  return picked.concat(rest).slice(0,CFG.bkSize);
};
const bkNeedsPick=()=>ownedCards().length>CFG.bkSize;
// Плотность боевой колоды — ранг для матчмейкинга
const RARW={C:1,R:2,L:4};
function bkDensity(list){
  const b=list||bkList();
  if(!b.length) return 0;
  return b.reduce((a,c)=>a+RARW[c.rar],0)/b.length;
}
function toggleBk(id){
  const own=ownedCards();
  if(own.length<=CFG.bkSize) return;
  const i=S.bkPicked.indexOf(id);
  if(i>=0) S.bkPicked.splice(i,1);
  else{
    if(S.bkPicked.length>=CFG.bkSize){ log('В боевой колоде уже 50 карт','warn'); render(); return; }
    S.bkPicked.push(id);
  }
  render();
}
function log(msg,cls){ S.log.unshift({d:S.day,msg,cls}); if(S.log.length>250) S.log.pop(); }

/* ================= ВЫДАЧА КАРТЫ ================= */
function noveltyChance(){ return noveltyChanceBy(uniq()/120); }
function pickNewCard(){ // возвращает индекс карты или null
  const locked=safeLocked();
  const free=id=>!S.opened[id] && !locked.includes(id);
  const all=[]; for(let i=0;i<120;i++) if(free(i)) all.push(i);
  if(!all.length) return null;
  // Все новые карты идут «в колоду» по ФИКСИРОВАННОЙ очереди и ступеням лестницы.
  // (Хвостовая ступень раздаёт карты по дальним колодам — она заменяет прежнюю случайную раскладку.)
  const openDecks=[];
  CFG.deckOrderFixed.forEach(d=>{ const miss=deckCards(d).filter(free); if(miss.length) openDecks.push({d,miss}); });
  if(!openDecks.length) return all[Math.floor(Math.random()*all.length)];
  const nOpen=openDecks.length;
  // ── Каждая N-я новая карта — полностью случайная среди всех доступных ──
  if(TUNE.randomEveryN>0){
    S.randCount=(S.randCount||0)+1;
    if(S.randCount % TUNE.randomEveryN === 0) return all[Math.floor(Math.random()*all.length)];
  }
  // ── Точечное заполнение отстающей колоды ──
  // Каждая N-я новая карта идёт не по лестнице, а в колоду с наименьшей заполненностью.
  // Заполненность считается по ДОСТУПНЫМ картам (карта в сейфе не делает колоду вечно отстающей).
  // fillMinGap=0 — срабатывает всегда; иначе нужно отставание от средней не меньше указанного.
  if(TUNE.fillEveryN>0){
    S.newCount=(S.newCount||0)+1;
    if(S.newCount % TUNE.fillEveryN === 0){
      const info=openDecks.map(o=>{
        const avail=deckCards(o.d).filter(i=>!locked.includes(i)).length;   // доступно всего
        const have=deckCards(o.d).filter(i=>S.opened[i]).length;            // уже открыто
        return {o, have, ratio: avail>0 ? have/avail : 1};
      });
      const avgHave=info.reduce((a,x)=>a+x.have,0)/(info.length||1);
      let best=info[0];
      info.forEach(x=>{ if(x.ratio < best.ratio) best=x; });                // при равенстве — выше в очереди
      if(TUNE.fillMinGap<=0 || (avgHave - best.have) >= TUNE.fillMinGap){
        return best.o.miss[Math.floor(Math.random()*best.o.miss.length)];
      }
    }
  }
  let w=openDecks.map((o,k)=>{
    let x=ladderRankWeight(k, nOpen);
    if(o.miss.length<=2) x*=TUNE.finishLe2;
    else if(o.miss.length<=4) x*=TUNE.finishLe4;
    return x;
  });
  // Коэффициент убыли: чем ближе колода к сборке, тем больше её веса утекает вниз.
  // filled/10 — доля собранного; срезанное перераспределяется на остальные открытые колоды
  // пропорционально их текущему весу. decay=0 — выключено (резкий переход при закрытии),
  // decay=1 — почти собранная колода почти не тянет вес на себя, переход плавный.
  if(TUNE.decay>0){
    let freed=0;
    w=w.map((x,k)=>{ const filled=10-openDecks[k].miss.length; const cut=x*(filled/10)*TUNE.decay; freed+=cut; return x-cut; });
    const wsum=w.reduce((a,b)=>a+b,0)||1;
    w=w.map(x=> x + freed*(x/wsum));   // излишек делим пропорционально остаточным весам
  }
  const sum=w.reduce((a,b)=>a+b,0); let r=Math.random()*sum;
  let pick=openDecks[0];
  for(let k=0;k<openDecks.length;k++){ r-=w[k]; if(r<=0){ pick=openDecks[k]; break; } }
  return pick.miss[Math.floor(Math.random()*pick.miss.length)];
}
function pickDup(rarForce){
  const rar = rarForce || (()=>{const s=TUNE.dupC+TUNE.dupR+TUNE.dupL||1; const r=Math.random()*s; return r<TUNE.dupC?'C':(r<TUNE.dupC+TUNE.dupR?'R':'L');})();
  let own=CARDS.filter(c=>S.opened[c.id] && c.rar===rar);
  if(!own.length) own=CARDS.filter(c=>S.opened[c.id]);
  if(!own.length) return null;
  return own[Math.floor(Math.random()*own.length)].id;
}
// forceNew — стартовые паки; guarantee — 'new' | 'rare' | null
function grantCard(forceNew=false, guarantee=null){
  const atCap = uniq()>=cap();
  let id=null, isNew=false;
  // ВАЖНО: индекс карты может быть 0, поэтому проверяем строго на null
  if((forceNew||guarantee==='new') && !atCap){ const p=pickNewCard(); if(p!==null){ id=p; isNew=true; } }
  if(id===null && !atCap && Math.random()<noveltyChance()){ const p=pickNewCard(); if(p!==null){ id=p; isNew=true; } }
  if(id===null){
    id=pickDup(guarantee==='rare'?'R':null);
    if(id===null){ // совсем нечего выдать — компенсация
      addBonus(2); log('Гарантия невыполнима — компенсация 2 бонус-картами','warn'); return null;
    }
  }
  S.stat.cardsGotToday++;
  if(isNew){ S.opened[id]=true; S.copies[id]=1; S.stat.newCards++; S.stat.newCardsToday++; }
  else if(S.copies[id]===0){ S.copies[id]=1; }
  else { S.copies[id]++; S.stat.dups++; S.stat.dupsPack++; const v=CFG.starValue[CARDS[id].rar]; S.stars+=v; S.stat.starsEarned+=v; }
  return {id,isNew};
}
function openPack(n=5,opts={}){
  const got=[];
  for(let i=0;i<n;i++){
    const g=grantCard(opts.forceNew===true, i===0?(opts.guarantee||null):null);
    if(g) got.push(g);
  }
  checkAchievements();
  return got;
}
function addBonus(n=1){
  for(let i=0;i<n;i++){
    const r=Math.random(); const rar=r<0.70?'C':(r<0.95?'R':'L');
    let pool=BONUS.map((b,i)=>({b,i})).filter(x=>x.b.rar===rar);
    if(!pool.length) pool=BONUS.map((b,i)=>({b,i}));
    const p=pool[Math.floor(Math.random()*pool.length)];
    S.bonus[p.i]=(S.bonus[p.i]||0)+1;
  }
}
function repairState(){ // страховка от рассинхрона: экземпляр без открытия невозможен
  if(S.packIdx===undefined) S.packIdx=Math.min(5,Math.floor(S.dailyDone/10));
  if(S.packOffers===undefined) S.packOffers=0;
  if(!S.dailyDoneIdx) S.dailyDoneIdx=[];
  if(S.achSteps===undefined) S.achSteps=0;
  if(S.draws===undefined) S.draws=0;
  if(S.newCount===undefined) S.newCount=0;
  if(S.randCount===undefined) S.randCount=0;
  for(let i=0;i<120;i++) if(S.copies[i]>0 && !S.opened[i]) S.opened[i]=true;
}
function checkAchievements(){
  repairState();
  for(let d=0;d<12;d++) if(!S.achDecks[d] && deckClosed(d)){
    S.achDecks[d]=true; S.coins+=TUNE.achDeck;
    log(`Колода «${CFG.animals[d]}» собрана: +${TUNE.achDeck} монет`,'good');
  }
  if(!S.achBk && bkList().length>=50){ S.achBk=true; S.coins+=CFG.achievements.bk50; log(`Боевая колода из 50 карт: +${CFG.achievements.bk50} монет`,'good'); }
  if(!S.achFull && uniq()===120){ S.achFull=true; S.coins+=CFG.achievements.full; log(`Полная коллекция 120/120: +${CFG.achievements.full} монет`,'good'); }
}
/* ================= ДЕНЬ ================= */
function currentPack(){ return Math.min(S.packIdx||0, CFG.dailyPackNames.length-1); }
function advancePack(reason){
  if(S.packIdx>=CFG.dailyPackNames.length-1) return;
  S.packIdx++; S.packOffers=0;
  log(`Открылась пачка заданий «${CFG.dailyPackNames[S.packIdx]}» (${reason})`,'good');
}
function rollDailyTask(){
  // пачка сменяется по 10 выполненным ИЛИ по 14 предложенным — иначе игрок,
  // которому не даётся одно задание, застревает на пачке до конца сезона
  S.packOffers=(S.packOffers||0)+1;
  if(S.packOffers>CFG.dailyPackTimeout) advancePack('пачка провисела 14 дней');
  const pk=currentPack(); const from=pk*CFG.dailyPackSize, to=from+CFG.dailyPackSize;
  const free=[]; for(let i=from;i<to;i++) if(!(S.dailyDoneIdx||[]).includes(i)) free.push(i);
  const pool=free.length?free:[from+Math.floor(Math.random()*CFG.dailyPackSize)];
  S.dailyTaskIdx = pool[Math.floor(Math.random()*pool.length)];
  S.dailyTaskDone=false;
}
function weekOf(day){ return Math.floor((day-1)/7); }
function nextDay(){
  if(S.seasonOver) return;
  if(S.day>=CFG.seasonDays){ S.seasonOver=true; log('Сезон завершён','warn'); render(); return; }
  S.day++;
  S.matchesToday=0; S.socialToday=false; S.qrToday=0;
  S.stat.cardsGotToday=0; S.stat.newCardsToday=0;
  // волны
  while(S.wave<9 && S.day>=CFG.waveDays[S.wave+1]){
    S.wave++;
    log(`Открылась волна ${S.wave+1}: потолок коллекции ${cap()} карт`,'good');
  }
  // вход
  const dow=((S.day-1)%7)+1;
  const c=CFG.loginCoins[dow]||0; if(c){ S.coins+=c; }
  const b=CFG.loginBonus[dow]||0; if(b){ addBonus(b); }
  if(CFG.loginPackDays.includes(dow)){ openPack(5); log(`Пак за ежедневный вход (день ${dow} цикла): 5 карт`,'good'); }
  if(S.day===1){ openPack(5,{forceNew:true}); log('Стартовый пак: 5 гарантированно новых карт','good'); }
  if(S.day===2){ openPack(5,{forceNew:true}); addBonus(3); log('Пак второго дня: 5 новых карт и 3 бонус-карты','good'); }
  rollDailyTask();
  checkAchievements();
  render();
}
/* ================= ЗАДАНИЯ ================= */
function taskProgress(t){
  const st=S.stat;
  const map={ free:1, matches:st.matches, rounds:st.rounds, newCards:st.newCards, wins:st.wins,
    bonusUsed:st.bonusUsed, blocked:S.blocked.length, clsMatches:st.clsMatches, proWins:st.proWins,
    streak:st.bestStreak, cardsGot:st.cardsGotToday, newToday:st.newCardsToday, packsBought:S.packsBought, debuffUsed:st.debuffUsed,
    cleanWin:st.cleanWin, sweep:st.sweep, legBonusUsed:st.legBonusUsed, total:uniq(),
    decksTotal:closedDecks(), bigWins:st.bigWins,
    deck8:(()=>{let n=0;for(let d=0;d<12;d++) if(deckCards(d).filter(i=>S.opened[i]).length>=8) n++; return n;})(),
    deck4:(()=>{let n=0;for(let d=0;d<12;d++) if(deckCards(d).filter(i=>S.opened[i]).length>=4) n++; return n;})(),
    deck3:(()=>{let n=0;for(let d=0;d<12;d++) if(deckCards(d).filter(i=>S.opened[i]).length>=3) n++; return n;})(),
    dups:st.dups,
    statWin0:st.statWin[0], statWin1:st.statWin[1], statWin2:st.statWin[2], statWin3:st.statWin[3],
    friends:S.friends, qrUsed:S.qrUsed, slotsBought:S.slots-1 };
  return map[t.k]!==undefined?map[t.k]:0;
}
function canDoDaily(){
  if(S.dailyTaskDone||S.dailyTaskIdx===null) return false;
  const t=DAILY_TASKS[S.dailyTaskIdx];
  return t.k==='free' || taskProgress(t)>=(t.n||1);
}
function doDaily(){
  if(!canDoDaily()) return;
  const pk=currentPack();
  S.coins+=CFG.dailyTaskCoins[pk]; S.dailyDone++; S.dailyTaskDone=true;
  S.dailyDoneIdx=(S.dailyDoneIdx||[]); S.dailyDoneIdx.push(S.dailyTaskIdx);
  const from=pk*CFG.dailyPackSize;
  let inPack=0; for(let i=from;i<from+CFG.dailyPackSize;i++) if(S.dailyDoneIdx.includes(i)) inPack++;
  if(inPack>=CFG.dailyPackSize) advancePack('все 10 заданий выполнены');
  log(`Задание выполнено: +${CFG.dailyTaskCoins[pk]} монет`,'good');
  if(Math.random()<CFG.dailyTaskPackChance[pk]){ openPack(5); log('За задание выпал пак: 5 карт','good'); }
  render();
}
function weeklyProgress(i){
  const w=CFG.weekly[i], st=S.stat, need=w.need, key=Object.keys(need)[0];
  const map={matches:st.matches,newCards:st.newCards,wins:st.wins,total:uniq(),
    bonusUsed:st.bonusUsed,bigWins:st.bigWins,decks:closedDecks()};
  return {have:map[key]||0, need:need[key]};
}
function doWeekly(i){
  if(S.weeklyDone[i]) return;
  if(weekOf(S.day)<i) return;
  const p=weeklyProgress(i); if(p.have<p.need) return;
  const w=CFG.weekly[i];
  S.weeklyDone[i]=true; S.coins+=w.coins; addBonus(w.bonus);
  if(w.pack){ openPack(5); }
  log(`Еженедельное задание ${i+1}: +${w.coins} монет, ${w.bonus} бонус-карт${w.pack?', пак из 5 карт':''}`,'good');
  render();
}
function doSocialOnce(){
  if(S.socialOnce>=CFG.social.onceCount) return;
  S.socialOnce++; S.coins+=CFG.social.onceCoins;
  log(`Социальное действие: +${CFG.social.onceCoins} монет`,'good'); render();
}
function doSocialDaily(){
  if(S.socialToday) return;
  S.socialToday=true; S.coins+=CFG.social.dailyCoins; render();
}
function inviteFriend(){
  S.friends++;
  const st=CFG.referral[S.refStage];
  if(st && S.friends>=st.friends){
    S.refStage++; S.coins+=st.coins; addBonus(st.bonus);
    if(st.pack) openPack(5);
    log(`Реферальный этап «${st.friends} друзей»: +${st.coins} монет, ${st.bonus} бонус-карт${st.pack?', пак':''}`,'good');
  } else if(S.friends>10){
    const extra=Math.floor((S.friends-10)/CFG.referralRepeatEvery);
    if(extra>S.refRepeat && S.refRepeat<CFG.referralRepeatMax){
      S.refRepeat=extra; addBonus(CFG.referralRepeatBonus);
      log(`Ещё 10 друзей: +1 бонус-карта`,'good');
    }
  }
  render();
}
function scanQR(){
  if(S.qrUsed>=CFG.qr.limit){ log('Лимит QR-кодов исчерпан (120 на аккаунт)','warn'); render(); return; }
  S.qrUsed++; addBonus(CFG.qr.bonusPerCode);
  log(`QR-код отсканирован: +${CFG.qr.bonusPerCode} бонус-карты`,'good'); render();
}
/* ================= МАГАЗИН ================= */
function buyPack(id){
  const p=CFG.packs.find(x=>x.id===id);
  if(S.stars<p.price){ log('Недостаточно звёзд','warn'); render(); return; }
  S.stars-=p.price; S.packsBought++;
  const wasAtCap = uniq()>=cap();
  const got=openPack(p.cards,{guarantee:p.guarantee});
  const nw=got.filter(g=>g.isNew).length;
  if(p.guarantee==='new' && wasAtCap){
    addBonus(2);
    log(`${p.name} за ${p.price}★: новых карт пока нет, следующая волна ещё не открылась. Начислено 2 бонус-карты сверх пака`,'warn');
  } else {
    log(`${p.name} за ${p.price}★: ${nw} новых из ${got.length}`,'good');
  }
  render();
}
function buySlot(){
  if(S.slots>=5) return;
  const price=CFG.slotPrices[S.slots];
  if(S.coins<price){ log('Недостаточно монет','warn'); render(); return; }
  S.coins-=price; S.slots++;
  log(`Куплен слот блокировки ${S.slots} за ${price} монет`,'good'); render();
}
function toggleBlock(id){
  const i=S.blocked.indexOf(id);
  if(i>=0){ S.blocked.splice(i,1); }
  else{ if(S.blocked.length>=S.slots){ log('Все слоты блокировки заняты','warn'); render(); return; } S.blocked.push(id); }
  render();
}
function buyPrize(id){
  const p=CFG.shop.find(x=>x.id===id);
  if(S.coins<p.price){ log('Недостаточно монет','warn'); render(); return; }
  S.coins-=p.price; S.prizes[id]=(S.prizes[id]||0)+1;
  if(id==='bonuspack') addBonus(5);
  log(`Куплено: ${p.name} за ${p.price} монет`,'good'); render();
}
/* ================= PvP ================= */
let M=null; // текущий матч

/* ===== Переключение контекста между вариантами ===== */
function useSlot(i){
  ACTIVE=i;
  Object.keys(TUNE).forEach(k=>{ delete TUNE[k]; });
  Object.assign(TUNE, JSON.parse(JSON.stringify(SLOTS[i].tune)));
  S=SLOTS[i].S;
}
function storeSlot(i){ SLOTS[i].S=S; SLOTS[i].tune=JSON.parse(JSON.stringify(TUNE)); }
function initSlots(){
  SLOTS=VARIANTS.map(v=>({v, tune:variantTune(v), S:null}));
  SLOTS.forEach((sl,i)=>{ setSeed(1000+i); S=newState(); sl.S=S; });
  useSlot(0); M=null;
}
function switchTo(i){ storeSlot(ACTIVE); M=null; useSlot(i); render();
  // панель параметров живёт отдельно от render() — перерисовываем её,
  // иначе в полях остаются значения предыдущего варианта
  if($('tunepanel').style.display!=='none') renderTune();
}

/* ===== Автоматический матч (для фонового прогона дня) ===== */
function autoMatch(){
  stopTurnTimer();
  const mode = uniq()>=30?'pro':(uniq()>=15?'cls':'exp');
  startMatch(mode);
  let g=0;
  while(M && M.phase && M.phase!=='over' && M.myHand.length && M.botHand.length && g++<14){
    let c, st=null;
    if(M.namer==='me'){
      // называю сам: беру лучшую пару «карта + характеристика» из руки
      let best={v:-1};
      M.myHand.forEach(id=>{ CARDS[id].st.forEach((v,s)=>{ if(v>best.v) best={v,id,s}; }); });
      c=best.id; st=best.s;
    } else {
      // отвечаю: характеристика названа и видна — играю сильнейшей по ней
      const ps=M.pendingStat;
      c=M.myHand.reduce((a,b)=>CARDS[b].st[ps]>CARDS[a].st[ps]?b:a);
    }
    const own=bonusOwnedList();
    if(own.length && (BONUS_TIMING==='open' || Math.random()<0.5))
      chooseMyBonus(own[Math.floor(Math.random()*own.length)].i);
    playRound(c, st);
  }
  M=null;
}

/* ===== Прожить день ВО ВСЕХ вариантах одновременно ===== */
let MATCHES_PER_DAY=4;
// Тумблеры автопрогона: что именно делает «виртуальный игрок» каждый день.
// Выключенное не выполняется ни в одном варианте — так можно изолировать источник карт.
const AUTO={ tasks:true, qr:true, pvp:true };
// Момент применения бонус-карты: 'blind' — выбирается вместе с картой, вслепую;
// 'open' — после вскрытия обеих карт, когда уже видно, кто выигрывает раунд.
let BONUS_TIMING='blind';
function setTiming(v){ BONUS_TIMING=v; render(); }
function toggleAuto(key){ AUTO[key]=!AUTO[key]; render(); }
function setMatches(v){ const n=parseInt(String(v).trim()); if(!isFinite(n)||n<0||n>20) return; MATCHES_PER_DAY=n; render(); }
function nextDayAll(){
  const cur=ACTIVE;
  storeSlot(cur);
  NORENDER=true;
  const daySeed = 7919*(SLOTS[0].S.day+1) + 13;
  SLOTS.forEach((sl,i)=>{
    useSlot(i);

    if(S.seasonOver) return;

    if(AUTO.tasks){
      if(canDoDaily()) doDaily();
      if(!S.socialToday) doSocialDaily();

    }
    if(AUTO.qr && S.qrUsed<CFG.qr.limit && S.qrToday<1){ S.qrToday++; S.qrUsed++; addBonus(CFG.qr.bonusPerCode); }
    if(AUTO.pvp){ for(let m=0;m<MATCHES_PER_DAY;m++) autoMatch(); }

  });

}
function nextDaysAll(n){ for(let k=0;k<n;k++){ if(SLOTS[ACTIVE].S.seasonOver) break; nextDayAll(); } }
function resetAll(){ if(confirm('Начать заново все профили?')){ initSlots(); render(); } }
// Бот-соперник: коллекция в коридоре матчмейкинга, боевая колода того же размера,
// что и у игрока (реальный соперник тоже теряет экземпляры в матчах).
function botCollection(myUniq,mm,myBkSize){
  const target=Math.max(5,Math.min(120, myUniq + Math.round((Math.random()*2-1)*mm)));
  // соперник — живой игрок: у него такой же по составу запас экземпляров, а не полная коллекция
  const myBk=bkList(); const mine={L:0,R:0,C:0}; myBk.forEach(c=>mine[c.rar]++);
  const byR={L:[],R:[],C:[]};
  const locked=safeLocked();
  CARDS.forEach(c=>{ if(!locked.includes(c.id)) byR[c.rar].push(c.id); });
  Object.values(byR).forEach(a=>{ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} });
  const jitter=x=>Math.max(0,Math.round(x*(0.92+Math.random()*0.16)));   // разрыв плотности в пределах 8%
  const own=[...byR.L.slice(0,jitter(mine.L)), ...byR.R.slice(0,jitter(mine.R)), ...byR.C.slice(0,jitter(mine.C))];
  if(own.length<3){ const ids=[...Array(120).keys()]; return ids.slice(0,Math.max(3,myBkSize)); }
  const ids=own;
  const size=Math.max(3,Math.min(CFG.bkSize, myBkSize, ids.length));
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  return ids.slice(0,size);
}
function availableModes(){
  const u=uniq();
  return Object.entries(CFG.modes).filter(([k,m])=>u>=m.access).map(([k])=>k);
}
// Рука на матч: случайные N карт из боевой колоды, без ограничений по редкости.
function drawHand(ids,m){
  const pool=[...ids];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,m.cards);
}
function startMatch(modeKey){
  const m=CFG.modes[modeKey];
  const bk=bkList();
  if(bk.length<m.cards){ log(`Для режима ${m.name} нужно минимум ${m.cards} карт в боевой колоде`,'warn'); render(); return; }
  const myHand=drawHand(bk.map(c=>c.id), m);
  const botBk=botCollection(uniq(),m.mm,bk.length);
  const botHand=drawHand(botBk, m);
  M={mode:modeKey,m,myHand,botHand,myWins:0,botWins:0,roundDraws:0,round:1,
     namer:Math.random()<0.5?'me':'bot',phase:'',pendingStat:null,botCard:null,
     myBonus:null,botBonus:null,myCard:null,myStat:null,lostCards:0,logs:[]};
  // ── Вытяжка бонус-карт на матч: число = число раундов режима (3/5/7).
  //    Тянем СЛУЧАЙНЫЕ из имеющегося запаса игрока. Чего нет — не компенсируется.
  const drawN = {exp:TUNE.bonusDrawExpress, cls:TUNE.bonusDrawClassic, pro:TUNE.bonusDrawPro}[modeKey];
  M.myDrawn = drawBonusHand(S.bonus, drawN);         // [{i,rar,...}] — доступные в этом матче
  M.myDrawnLeft = M.myDrawn.map(b=>b.i);             // индексы, ещё не сыгранные
  // Соперник получает бонус-карты по ТОМУ ЖЕ правилу: у него условный запас,
  // сопоставимый с запасом игрока (как и коллекция — зеркало с разбросом ±8%).
  // Если у игрока запас пуст, соперник тоже играет без бонус-карт.
  const myStock = Object.values(S.bonus||{}).reduce((a,b)=>a+(b||0),0);
  const botStock = Math.max(0, Math.round(myStock*(0.92+Math.random()*0.16)));
  const botDrawN = Math.min(drawN, botStock);
  M.botDrawnPool = [];
  for(let k=0;k<botDrawN;k++) M.botDrawnPool.push(Math.floor(Math.random()*BONUS.length));
  M.botDrawIdx = 0;
  M.firstNamer=M.namer;
  prepRound();
  render();
}
// Тянет до n случайных РАЗНЫХ экземпляров из запаса (учитывая количество каждой карты)
function drawBonusHand(stock, n){
  const bag=[];
  Object.entries(stock).forEach(([i,cnt])=>{ for(let k=0;k<cnt;k++) bag.push(+i); });
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}
  return bag.slice(0,n).map(i=>({i,...BONUS[i]}));
}
function prepRound(){
  M.myBonus=null; M.botBonus=null; M.myCard=null; M.myStat=null; M.botCard=null; M.pendingStat=null;
  // Бот играет из своей вытянутой руки. В режиме «после вскрытия» он приберегает карту
  // и решает уже по факту сравнения (см. playRound), поэтому здесь только выбирает кандидата.
  if(M.botDrawIdx < M.botDrawnPool.length &&
     (BONUS_TIMING==='open' || Math.random()<CFG.botBonusChance)){
    M.botBonusPicked = M.botDrawnPool[M.botDrawIdx]; M.botDrawIdx++;
  } else M.botBonusPicked = null;
  if(!M.botHand.length||!M.myHand.length){ finishMatch(); return; }
  if(M.namer==='bot'){
    let best={v:-1};
    M.botHand.forEach(id=>{ CARDS[id].st.forEach((v,s)=>{ if(v>best.v) best={v,id,s}; }); });
    M.botCard=best.id; M.pendingStat=best.s; M.phase='respond';
  } else {
    M.phase='name';
  }
  startTurnTimer();
}
// В матче доступны ТОЛЬКО вытянутые бонус-карты, ещё не сыгранные.
function bonusOwnedList(){
  if(!M||!M.myDrawnLeft) return [];
  const cnt={}; M.myDrawnLeft.forEach(i=>cnt[i]=(cnt[i]||0)+1);
  return Object.entries(cnt).map(([i,n])=>({i:+i,n,...BONUS[+i]}));
}
function chooseMyBonus(i){ M.myBonus=(M.myBonus===i?null:i); render(); }

/* ===== Таймер хода: 10 секунд, по истечении ход делается автоматически ===== */
let turnTimer=null, turnLeft=0;
function stopTurnTimer(){ if(turnTimer){ clearInterval(turnTimer); turnTimer=null; } }
function startTurnTimer(){
  stopTurnTimer();
  if(NORENDER || !M || M.phase==='over') return;
  turnLeft=CFG.turnSeconds;
  paintTimer();
  turnTimer=setInterval(()=>{
    turnLeft--;
    paintTimer();
    if(turnLeft<=0){ stopTurnTimer(); autoPlayTurn(); }
  },1000);
}
function paintTimer(){
  const el=document.getElementById('turnclock');
  if(!el) return;
  el.textContent=turnLeft;
  el.className='clock'+(turnLeft<=3?' hot':'');
  const bar=document.getElementById('turnbar');
  if(bar) bar.style.width=Math.max(0,(turnLeft/CFG.turnSeconds*100))+'%';
}
// Время вышло — играем разумный ход, чтобы матч не вис
function autoPlayTurn(){
  if(!M || M.phase==='over') return;
  if(M.namer==='me'){
    let best={v:-1};
    M.myHand.forEach(id=>{ CARDS[id].st.forEach((v,s)=>{ if(v>best.v) best={v,id,s}; }); });
    log('Время вышло — ход сделан автоматически','warn');
    playRound(best.id,best.s);
  } else {
    const ps=M.pendingStat;
    const id=M.myHand.reduce((a,b)=>CARDS[b].st[ps]>CARDS[a].st[ps]?b:a);
    log('Время вышло — ответ выбран автоматически','warn');
    playRound(id,-1);
  }
}
function playRound(cardId,stat){
  if(!M||M.phase==='over'||!M.myHand.length||!M.botHand.length){ if(M) finishMatch(); render(); return; }
  const m=M.m;
  let myCard=cardId, botCard, statIdx;
  if(M.namer==='me'){
    myCard=cardId; statIdx=stat;
    // Отвечающий ВИДИТ названную характеристику и играет сильнейшей по ней.
    // (Слить слабую картой тоже можно — тактика игрока, бот играет на победу.)
    botCard=M.botHand.reduce((a,b)=>CARDS[b].st[statIdx]>CARDS[a].st[statIdx]?b:a);
  } else {
    statIdx=M.pendingStat; botCard=M.botCard; myCard=cardId;   // характеристика раскрывается только сейчас
  }
  // применение бонус-карт
  let myV=CARDS[myCard].st[statIdx], botV=CARDS[botCard].st[statIdx];
  const myB = M.myBonus!==null?BONUS[M.myBonus]:null;
  // В режиме «после вскрытия» карты обеих сторон уже открыты, поэтому бонус играется
  // только если он реально переворачивает раунд — иначе бережётся на следующий.
  const gainOf=(b,selfV,card)=>{
    if(b.type==='up'||b.type==='down') return b.val;
    if((b.type==='upStat'||b.type==='downStat') && b.stat===statIdx) return b.val;
    if(b.type==='rage') return Math.round(selfV*0.5);
    if(b.type==='swap') return Math.max(...CARDS[card].st)-selfV;
    return 0;
  };
  if(BONUS_TIMING==='open' && myB){
    const deficit = botV - myV;
    const g = gainOf(myB, myV, myCard);
    if(!(deficit>=0 && g>deficit)) M.myBonus=null;      // не решает — не тратим
  }
  if(BONUS_TIMING==='open' && M.botBonusPicked!==null){
    const b=BONUS[M.botBonusPicked];
    const deficit = myV - botV;
    let g=0;
    if(b.type==='up'||b.type==='down') g=b.val;
    else if((b.type==='upStat'||b.type==='downStat') && b.stat===statIdx) g=b.val;
    else if(b.type==='rage') g=Math.round(botV*0.5);
    else if(b.type==='swap') g=Math.max(...CARDS[botCard].st)-botV;
    if(!(deficit>=0 && g>deficit)) M.botBonusPicked=null;   // не решает — бережём карту
  }
  const myB2 = M.myBonus!==null?BONUS[M.myBonus]:null;
  const botB = M.botBonusPicked!==null?BONUS[M.botBonusPicked]:null;
  let myShield=false, botShield=false;
  const cancelledByMe = myB && myB.type==='cancel';
  const cancelledByBot = botB && botB.type==='cancel';
  const applyB=(b,who)=>{
    if(!b) return;
    if(who==='me'&&cancelledByBot&&b.type!=='cancel') return;
    if(who==='bot'&&cancelledByMe&&b.type!=='cancel') return;
    if(b.type==='up'){ if(who==='me') myV+=b.val; else botV+=b.val; }
    else if(b.type==='down'){ if(who==='me') botV-=b.val; else myV-=b.val; }
    else if(b.type==='upStat'){ if(b.stat===statIdx){ if(who==='me') myV+=b.val; else botV+=b.val; } }
    else if(b.type==='downStat'){ if(b.stat===statIdx){ if(who==='me') botV-=b.val; else myV-=b.val; } }
    else if(b.type==='rage'){ if(who==='me') myV=Math.round(myV*1.5); else botV=Math.round(botV*1.5); }
    else if(b.type==='swap'){ if(who==='me') myV=Math.max(...CARDS[myCard].st); else botV=Math.max(...CARDS[botCard].st); }
    else if(b.type==='shield'){ if(who==='me') myShield=true; else botShield=true; }
    else if(b.type==='voice'){
      if(who==='me'&&M.namer==='bot'){
        let best={v:-1}; M.myHand.forEach(id=>{CARDS[id].st.forEach((v,s)=>{if(v>best.v)best={v,id,s};});});
        statIdx=best.s; myCard=best.id;
        botCard=M.botHand.reduce((a,b2)=>CARDS[b2].st[statIdx]>CARDS[a].st[statIdx]?b2:a);
        myV=CARDS[myCard].st[statIdx]; botV=CARDS[botCard].st[statIdx];
      }
    }
  };
  applyB(myB2,'me'); applyB(botB,'bot');
  if(myB2){ S.bonus[M.myBonus]=Math.max(0,(S.bonus[M.myBonus]||0)-1); S.stat.bonusUsed++;
    const di=M.myDrawnLeft.indexOf(M.myBonus); if(di>=0) M.myDrawnLeft.splice(di,1);
    if(myB.type==='down') S.stat.debuffUsed++;
    if(myB.rar==='L') S.stat.legBonusUsed++; }
  // исход
  let res;
  if(myV>botV) res='win'; else if(botV>myV) res='lose'; else res='draw';
  const sname=CFG.statNames[statIdx];
  let txt=`Раунд ${M.round}: ${CARDS[myCard].name} (${sname} ${myV}) против ${CARDS[botCard].name} (${botV})`;
  if(res==='win'){
    M.myWins++; S.stat.rounds++; S.stat.statWin[statIdx]++;
    S.copies[botCard]=(S.copies[botCard]||0)+ (S.opened[botCard]?1:0);
    if(!S.opened[botCard] && uniq()<cap()){ S.opened[botCard]=true; S.copies[botCard]=1; S.stat.newCards++; S.stat.newCardsToday++; txt+=' — победа, карта соперника новая!'; }
    else if(!S.opened[botCard]){ txt+=' — победа, но потолок волны достигнут'; }
    else { if(S.copies[botCard]>1){S.stat.dups++; S.stat.dupsPvP++; const v=CFG.starValue[CARDS[botCard].rar]; S.stars+=v; S.stat.starsEarned+=v;} txt+=' — победа, карта забрана'; }
    S.stat.cardsWon++;
  } else if(res==='lose'){
    M.botWins++; S.stat.roundsLost++;
    if(myShield){ txt+=' — поражение, но Щит сохранил карту'; }
    else { S.copies[myCard]=Math.max(0,S.copies[myCard]-1); S.stat.cardsLost++; M.lostCards++; txt+=' — поражение, экземпляр потерян'; }
  } else { M.roundDraws++; S.stat.roundDraws++; txt+=' — ничья, карты остались у владельцев'; }
  M.logs.unshift(txt);
  M.myHand=M.myHand.filter(x=>x!==myCard);
  M.botHand=M.botHand.filter(x=>x!==botCard);
  (M.history=M.history||[]).push({ n:M.round, myCard, botCard, statIdx, myV, botV,
      res: myV>botV?'win':(botV>myV?'lose':'draw'),
      myBonusName: myB2?myB2.name:null, botBonusName: botB?botB.name:null, lost: (myV<botV) });
  M.lastRound={ myCard, botCard, statIdx, myV, botV,
                res: myV>botV?'win':(botV>myV?'lose':'draw'),
                myBonusName: myB2?myB2.name:null, botBonusName: botB?botB.name:null };
  M.round++; M.namer = M.namer==='me'?'bot':'me';   // строгое чередование: монетка решает только первый раунд
  if(M.myWins>=m.need||M.botWins>=m.need||!M.myHand.length||!M.botHand.length) finishMatch();
  else prepRound();
  render();
}
function finishMatch(){
  stopTurnTimer();
  const m=M.m; S.stat.matches++; S.matchesToday++;
  if(M.mode==='cls') S.stat.clsMatches++;
  let k=1; for(const [n,mult] of CFG.rewardCurve){ if(S.matchesToday<=n){ k=mult; break; } }
  let res, coins=0, rat=0;
  if(M.myWins>M.botWins){
    res='победа'; coins=Math.round(m.win*k); rat=Math.round(m.ratW*k);
    S.stat.wins++; S.stat.streak++; S.stat.bestStreak=Math.max(S.stat.bestStreak,S.stat.streak);
    if(M.mode==='pro') S.stat.proWins++;
    if(M.mode!=='exp') S.stat.bigWins++;
    if(M.lostCards===0) S.stat.cleanWin++;
    if(M.botWins===0) S.stat.sweep++;
  } else if(M.myWins<M.botWins){
    res='поражение'; coins=Math.round(m.lose*k); S.stat.losses++; S.stat.streak=0;
  } else {
    res='ничья'; coins=Math.round(m.draw*k); rat=Math.round(m.ratD*k); S.stat.draws++; S.stat.streak=0;
  }
  S.coins+=coins; S.rating+=rat;
  log(`${m.name}: ${res} ${M.myWins}:${M.botWins} — +${coins} монет${rat?`, +${rat} рейтинга`:''}${k<1?` (награда ${Math.round(k*100)}%)`:''}`, res==='победа'?'good':(res==='ничья'?'':'warn'));
  checkAchievements();
  M.phase='over'; M.result=res; M.coinsGot=coins; M.ratGot=rat;
}
function closeMatch(){ stopTurnTimer(); M=null; render(); }
/* ================= РЕНДЕР ================= */
const $=id=>document.getElementById(id);
const RAR={C:'Обычная',R:'Редкая',L:'Легендарная'};

let NORENDER=false;

function renderMatch(){
  const m=M.m;
  const st=M.phase==='respond'?M.pendingStat:null;
  let h='';
  // ── шапка боя: счёт и таймер ──
  h+=`<div class="arena-head">
    <div class="score"><span class="me">${M.myWins}</span><span class="sep">:</span><span class="op">${M.botWins}</span></div>
    <div class="minfo"><b>${m.name}</b><span class="muted"> · раунд ${M.round} · до ${m.need} побед${M.roundDraws?` · ничьих ${M.roundDraws}`:''}</span></div>
    ${M.phase!=='over'?`<div class="timer"><span id="turnclock" class="clock">${turnLeft||CFG.turnSeconds}</span><span class="muted">сек</span></div>`:''}
  </div>`;
  if(M.phase!=='over') h+=`<div class="tbarwrap"><div id="turnbar" class="tbar"></div></div>`;

  if(M.phase==='over'){
    const cls=M.result==='победа'?'good':(M.result==='ничья'?'':'bad');
    h+=`<div class="mres ${cls}">Матч окончен: ${M.result} ${M.myWins}:${M.botWins} · +${M.coinsGot} монет${M.ratGot?`, +${M.ratGot} рейтинга`:''}${M.lostCards?` · потеряно карт: ${M.lostCards}`:''}</div>`;
    // разбор боя по раундам — видно, где и почему потеряна карта
    h+=`<div class="hist"><div class="histh">Как прошёл бой</div>`;
    (M.history||[]).forEach(r=>{
      const mc=CARDS[r.myCard], bc=CARDS[r.botCard];
      const verd = r.res==='win' ? '<span class="rwin">выигран</span>'
                 : r.res==='lose' ? '<span class="rlose">проигран</span>'
                 : '<span class="rdraw">ничья</span>';
      h+=`<div class="hrow">
        <span class="hn">${r.n}</span>
        <span class="hs">${CFG.statNames[r.statIdx]}</span>
        <span class="hc"><i class="rdot ${mc.rar}"></i>${mc.name} <b>${r.myV}</b>${r.myBonusName?` <em>${r.myBonusName}</em>`:''}</span>
        <span class="hv">${verd}</span>
        <span class="hc"><i class="rdot ${bc.rar}"></i>${bc.name} <b>${r.botV}</b>${r.botBonusName?` <em>${r.botBonusName}</em>`:''}</span>
        <span class="hl">${r.res==='lose'?'карта ушла сопернику':(r.res==='win'?'карта забрана':'')}</span>
      </div>`;
    });
    h+=`</div><button class="primary" onclick="closeMatch()">Закрыть</button>`;
    $('match').innerHTML=h; stopTurnTimer(); return;
  }

  // ── сторона соперника: карты рубашкой вниз ──
  h+=`<div class="side op"><div class="sidelbl">Соперник · карт ${M.botHand.length}</div><div class="backs">`;
  for(let i=0;i<M.botHand.length;i++) h+=`<div class="back"></div>`;
  h+=`</div></div>`;

  // ── арена: что было в прошлом раунде ──
  if(M.lastRound){
    const L=M.lastRound, mc=CARDS[L.myCard], bc=CARDS[L.botCard];
    const tag=L.res==='win'?'<span class="rwin">раунд выигран</span>':(L.res==='lose'?'<span class="rlose">раунд проигран</span>':'<span class="rdraw">ничья</span>');
    h+=`<div class="arena">
      <div class="acard ${bc.rar}"><div class="an"><i class="rdot ${bc.rar}"></i>${bc.name}</div><div class="av">${L.botV}</div>${L.botBonusName?`<div class="ab">${L.botBonusName}</div>`:''}</div>
      <div class="amid"><div class="astat">${CFG.statNames[L.statIdx]}</div>${tag}</div>
      <div class="acard ${mc.rar}"><div class="an"><i class="rdot ${mc.rar}"></i>${mc.name}</div><div class="av">${L.myV}</div>${L.myBonusName?`<div class="ab">${L.myBonusName}</div>`:''}</div>
    </div>`;
  }

  // ── подсказка хода ──
  h+=`<div class="turn ${M.namer==='me'?'mine':'theirs'}">${M.namer==='me'
      ? 'Ваш ход — выберите карту и характеристику, по которой сравниваете'
      : `Соперник сравнивает по характеристике <b>${CFG.statNames[M.pendingStat]}</b> — выберите, чем ответить`}</div>`;

  // ── бонус-карты этого матча ──
  const own=bonusOwnedList();
  if(own.length){
    h+=`<div class="bonusbar"><span class="muted">Бонус-карты боя (${M.myDrawnLeft.length} из ${M.myDrawn.length})${BONUS_TIMING==='open'?' · применится только если перевернёт раунд':''}:</span> `;
    own.forEach(b=>{ h+=`<button class="bchip ${M.myBonus===b.i?'sel':''} ${b.rar}" title="${b.desc}" onclick="chooseMyBonus(${b.i})">${b.name}${b.n>1?` <i>×${b.n}</i>`:''}<em>${b.desc}</em></button>`; });
    h+=`</div>`;
  } else if(M.myDrawn && M.myDrawn.length===0){
    h+=`<div class="bonusbar"><span class="muted">Бонус-карт в запасе не было — бой без бонусов.</span></div>`;
  } else {
    h+=`<div class="bonusbar"><span class="muted">Бонус-карты боя закончились.</span></div>`;
  }

  // ── своя рука ──
  h+=`<div class="side me"><div class="sidelbl">Ваша рука · карт ${M.myHand.length}</div></div>`;
  h+='<div class="hand">';
  M.myHand.forEach(id=>{
    const c=CARDS[id];
    const best=c.st.indexOf(Math.max(...c.st));
    const rn={C:'обычная',R:'редкая',L:'легендарная'}[c.rar];
    h+=`<div class="hcard ${c.rar}${M.namer==='bot'?' answerable':''}">
          <div class="hname">${c.name}</div>
          <div class="rlbl ${c.rar}"><i class="rdot ${c.rar}"></i>${rn}</div>
          <div class="stats">`;
    c.st.forEach((v,si)=>{
      const hot = (st!==null && si===st) ? ' hot' : (si===best?' best':'');
      if(M.namer==='me'){
        h+=`<button class="stat${hot}" onclick="playRound(${id},${si})">${CFG.statNames[si]}<b>${v}</b></button>`;
      } else {
        h+=`<div class="stat flat${hot}">${CFG.statNames[si]}<b>${v}</b></div>`;
      }
    });
    h+='</div>';
    if(M.namer==='bot') h+=`<button class="answer" onclick="playRound(${id},-1)">Ответить</button>`;
    h+='</div>';
  });
  h+='</div>';
  if(M.logs.length) h+=`<div class="mlog">${M.logs.slice(0,4).map(x=>`<div>${x}</div>`).join('')}</div>`;
  $('match').innerHTML=h;
  paintTimer();
}

function ladderWarn(){
  const s=ladderSum();

}
function decayHint(){
  const d=TUNE.decay;
  if(d===0) return 'Убыль выключена: пока колода не собрана, она держит полный вес, а в момент закрытия следующая резко получает его целиком.';
  if(d<0.4) return `Слабая убыль (${fmt(d)}): вес утекает вниз понемногу, переход между колодами чуть сглажен.`;
  if(d<0.8) return `Средняя убыль (${fmt(d)}): по мере сбора колода отдаёт заметную часть веса следующим — переход плавный, без скачка при закрытии.`;
  return `Сильная убыль (${fmt(d)}): почти собранная колода уже почти не тянет вес на себя, карты активно идут в следующие колоды.`;
}
// Разбор числа: принимает и точку, и запятую; пустая строка/мусор — не применяем
function num(v){
  if(v===null||v===undefined) return NaN;
  const s=String(v).trim().replace(',','.');
  if(!/^\d+(\.\d+)?$/.test(s)) return NaN;   // только законченное число, «0.» не применяем
  const n=parseFloat(s);
  return isFinite(n)?n:NaN;
}

function refreshCalc(){
  const explicit=TUNE.ladderSteps.slice(0,-1).reduce((a,s)=>a+(+s.count||0),0);
  const lastDecks=Math.max(1,12-explicit);
  TUNE.ladderSteps.forEach((st,i)=>{
    const last=i===TUNE.ladderSteps.length-1;
    const per=last?(st.share/lastDecks*100):(st.count>0?st.share/st.count*100:0);
    const el=$('per_'+i); if(el) el.textContent=per.toFixed(1)+'%';
  });
  const lbl=$('lastDecksLbl'); if(lbl) lbl.textContent=lastDecks;
  const w=$('ladderwarn'); if(w) w.innerHTML=ladderWarn();
}

  const t=$('tv_'+key); if(t) t.value=n; renderSoon(); }
function setNovelty(key,v){ const n=num(v); if(isNaN(n)) return; TUNE[key]=n; storeSlot(ACTIVE);
  const t=$('tv_'+key); if(t) t.value=n; renderSoon(); }
function setStep(i,field,v){
  const n=num(v); if(isNaN(n)) return;
  TUNE.ladderSteps[i][field] = field==='count'?Math.max(1,Math.round(n)):n; storeSlot(ACTIVE);
  refreshCalc(); renderSoon();          // без renderTune — поле не теряет фокус
}
// Перерисовку остального интерфейса откладываем, чтобы ввод не лагал
let _rt=null;
function renderSoon(){ clearTimeout(_rt); _rt=setTimeout(()=>render(), 250); }
function addStep(){ TUNE.ladderSteps.splice(TUNE.ladderSteps.length-1,0,{count:1,share:0.05}); storeSlot(ACTIVE); renderTune(); render(); }
function delStep(i){ TUNE.ladderSteps.splice(i,1); storeSlot(ACTIVE); renderTune(); render(); }
function fmt(v){ return (v%1===0)?v:(+v).toFixed(2); }
const TUNE_DEFAULT=JSON.parse(JSON.stringify(TUNE));
function resetTune(){
  // возвращаем параметры ИМЕННО этого варианта, а не общий стартовый набор
  Object.keys(TUNE).forEach(k=>{ delete TUNE[k]; });
  Object.assign(TUNE, variantTune(SLOTS[ACTIVE].v));
  storeSlot(ACTIVE); buildSafe(); renderTune(); render();
}
function exportTune(){
  const payload={ _meta:{game:'BabyFox Лесная лига', exported:new Date().toISOString(),
                        deckOrderFixed:CFG.deckOrderFixed.map(d=>CFG.animals[d])}, tune:TUNE };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='babyfox-params.json'; a.click();
  log('Параметры выгружены в babyfox-params.json','good');
}
function importTunePrompt(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); const t=d.tune||d;
      Object.keys(TUNE).forEach(k=>{ if(t[k]!==undefined) TUNE[k]=t[k]; });
      storeSlot(ACTIVE); buildSafe(); renderTune(); render(); log('Параметры загружены','good');
    }catch(err){ alert('Не удалось прочитать файл параметров'); } };
    r.readAsText(f); };
  inp.click();
}
window.addEventListener('DOMContentLoaded',()=>{ initSlots(); render(); });

</script></body></html>
